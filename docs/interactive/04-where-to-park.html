<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>车该停在哪里</title>
<style>
  :root{--night:#101923;--deep:#0b1219;--chalk:#edf2ee;--mist:#9fb0b9;--steel:#8ea0aa;--rust:#e7774f;--blue:#68cee7;--gold:#eab75b;--ok:#8dd6a5;--line:#31414d}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--deep);color:var(--chalk)}body{overflow-x:hidden}
  .stage{position:relative;min-height:758px;overflow:hidden;background:linear-gradient(#182938 0,#0e1a24 51%,#0a1219 100%)}
  .stage:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:24px 24px}
  header{position:relative;z-index:4;padding:22px 26px 0;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.kicker{font:600 11px/1.2 "Arial Narrow",sans-serif;letter-spacing:.16em;color:var(--blue)}h1{font-family:"STKaiti","KaiTi",serif;font-size:28px;font-weight:600;margin:5px 0 7px;letter-spacing:.02em}header p{max-width:610px;margin:0;color:#b7c5cc;font-size:13px;line-height:1.65}.rule{font-size:11px;color:#aebbc3;border:1px solid #41515d;padding:7px 10px;border-radius:2px;background:rgba(8,15,21,.35);white-space:nowrap}
  .question{position:relative;z-index:4;margin:16px 26px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.question strong{font-family:"STKaiti","KaiTi",serif;font-size:18px;margin-right:5px}.mode{appearance:none;border:1px solid #52616c;background:#172632;color:#dce5e8;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:12px}.mode.active{background:#24424f;border-color:var(--blue);color:white;box-shadow:0 0 0 2px rgba(104,206,231,.1)}
  .scene-wrap{position:relative;z-index:2;margin:2px auto 0;width:min(1100px,100%);height:432px;touch-action:none}.scene-wrap svg{width:100%;height:100%;display:block}.drag-note{position:absolute;left:50%;top:102px;transform:translateX(-50%);font-size:11px;color:#c1cbd0;background:rgba(8,14,20,.66);padding:5px 9px;border:1px solid rgba(255,255,255,.12);pointer-events:none}.drag-note b{color:#ffd08a}
  #truck,#watch{cursor:grab;outline:none}#truck:active,#watch:active{cursor:grabbing}.hit{fill:transparent}.wheel{fill:#11181e;stroke:#a6b0b5;stroke-width:1.5}.truck-body{fill:var(--rust);stroke:#ffd0bd;stroke-width:1}.truck-window{fill:#9ed6e5;opacity:.8}.watch-line{stroke:var(--blue);stroke-width:2;stroke-dasharray:5 5}.watch-flag{fill:var(--blue)}
  .deck{stroke:#9eabb2;stroke-width:10}.girder{stroke:#536976;stroke-width:16}.pier{fill:#5d6d75}.water{fill:#0a2735}.water-line{stroke:#315d6d;stroke-width:1;opacity:.6}.response-shadow{fill:url(#shadowGrad);opacity:.2;transition:opacity .35s}.response-line{fill:none;stroke:var(--blue);stroke-width:2.5;opacity:0;transition:opacity .35s}.revealed .response-shadow{opacity:.55}.revealed .response-line{opacity:1}.target-line{stroke:var(--gold);stroke-width:2;stroke-dasharray:4 5;opacity:0}.revealed .target-line{opacity:1}.axis-label{fill:#93a5af;font-size:11px}.bridge-label{fill:#d5dfe3;font-size:11px}.truck-pos{fill:#ffd7c7;font-size:11px}.glow{filter:url(#glow)}
  .dock{position:relative;z-index:5;margin:-14px 26px 0;display:grid;grid-template-columns:minmax(190px,.8fr) minmax(260px,1.35fr) minmax(210px,.9fr);gap:12px}.panel{background:rgba(16,27,36,.9);border:1px solid #31424f;min-height:128px;padding:13px 14px;box-shadow:0 14px 34px rgba(0,0,0,.22)}.panel h2{font:600 11px/1.2 "Arial Narrow",sans-serif;letter-spacing:.12em;color:#91a4af;margin:0 0 9px;text-transform:uppercase}.meter{height:11px;background:#091118;border:1px solid #334753;position:relative;overflow:hidden}.meter span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#557681,var(--blue),var(--gold));width:0;transition:width .12s}.meter-copy{display:flex;justify-content:space-between;margin-top:8px;color:#b7c5cc;font-size:11px}.meter-copy b{color:white}.actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}button.action{border:1px solid #4c5d68;background:#22333f;color:#e8eff2;padding:7px 10px;cursor:pointer;font-size:11px}button.action.primary{background:var(--rust);border-color:#f29b7b;color:#fff}button.action:hover{filter:brightness(1.12)}button.action:focus-visible,.mode:focus-visible,#truck:focus-visible,#watch:focus-visible{outline:2px solid white;outline-offset:3px}
  .feedback{font-size:13px;line-height:1.65;color:#d6e0e4}.feedback strong{color:var(--gold)}.feedback .good{color:var(--ok)}.plain{font-family:"STKaiti","KaiTi",serif;font-size:16px;line-height:1.55}.term{display:none;border-left:2px solid var(--blue);padding-left:10px;color:#c6d2d8;font-size:12px;line-height:1.6}.revealed-ui .term{display:block}.term b{color:var(--blue)}.small{font-size:10px;color:#81949f;margin-top:7px}.twist{display:none}.advanced-ui .twist{display:inline-block}
  .sr{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}.fallback-range{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:min(700px,75%);accent-color:var(--rust);opacity:.01}.fallback-range:focus{opacity:1}
  @media(max-width:760px){.stage{min-height:880px}header{padding:15px 14px 0;display:block}h1{font-size:23px}.rule{display:inline-block;margin-top:9px}.question{margin:12px 14px 0}.question strong{width:100%;font-size:16px}.scene-wrap{height:390px}.drag-note{top:84px}.dock{margin:-2px 12px 0;grid-template-columns:1fr}.panel{min-height:auto;padding:11px}.term{font-size:11px}.fallback-range{opacity:.2}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <header><div><div class="kicker">MOVING LOAD / 04</div><h1>同一辆车，观察的结果不同，停车位置会不会变？</h1><p>先选一个要观察的量，再移动车辆。仪表显示当前结果与最大值的接近程度。</p></div><div class="rule">简支梁 · 单车</div></header>
  <div class="question" role="group" aria-label="选择观察目标"><strong>请选择观察量：</strong><button class="mode active" data-mode="right">右支座反力</button><button class="mode" data-mode="bend">蓝旗截面弯矩</button><button class="mode" data-mode="left">左支座反力</button></div>
  <section class="scene-wrap" aria-label="可拖动车辆与观察点的桥梁示意图">
    <div class="drag-note">拖动<b>橙色车辆</b>；选择蓝旗模式后，也可以拖动<b style="color:#8fe9ff">蓝旗</b></div>
    <svg id="scene" viewBox="0 0 1100 440" role="img" aria-labelledby="svgTitle svgDesc">
      <title id="svgTitle">车辆位置与桥梁观察量交互图</title><desc id="svgDesc">一座简支桥，橙色车辆可沿桥面拖动，蓝旗可改变观察位置，下方阴影显示响应变化。</desc>
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3547"/><stop offset="1" stop-color="#0e1a24"/></linearGradient><linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#68cee7" stop-opacity=".9"/><stop offset="1" stop-color="#68cee7" stop-opacity=".05"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <rect width="1100" height="440" fill="url(#sky)"/><circle cx="865" cy="70" r="31" fill="#d6e2df" opacity=".45"/><path d="M0 150 Q170 105 330 153 T650 145 T1100 152 V260 H0Z" fill="#132430" opacity=".8"/>
      <rect class="water" x="0" y="285" width="1100" height="155"/><path class="water-line" d="M0 318 Q140 310 280 318 T560 318 T840 318 T1120 318M0 355 Q180 347 360 355 T720 355 T1080 355"/>
      <line class="girder" x1="90" y1="231" x2="1010" y2="231"/><line class="deck" x1="70" y1="218" x2="1030" y2="218"/><path class="pier" d="M74 231h32l8 100H66zM994 231h32l8 100h-48z"/><path d="M65 331h50M985 331h50" stroke="#86949b" stroke-width="8"/>
      <rect id="trackHit" class="hit" x="55" y="175" width="990" height="72" style="cursor:crosshair" aria-label="点击桥面移动车辆"/>
      <g id="watch" tabindex="0" role="slider" aria-label="蓝旗观察位置" aria-valuemin="10" aria-valuemax="90" aria-valuenow="50"><line class="watch-line" x1="550" y1="116" x2="550" y2="330"/><path class="watch-flag glow" d="M550 118v-32l35 11-35 11"/><circle class="hit" cx="550" cy="120" r="42"/></g>
      <g id="truck" tabindex="0" role="slider" aria-label="车辆位置" aria-valuemin="0" aria-valuemax="100" aria-valuenow="26" transform="translate(320 0)"><path class="truck-body" d="M-38 202h72v-26h-17l-11-18h-28l-9 18h-7z"/><path class="truck-window" d="M-18 174l5-11H3l8 11z"/><circle class="wheel" cx="-22" cy="204" r="9"/><circle class="wheel" cx="21" cy="204" r="9"/><rect class="hit" x="-54" y="145" width="108" height="80"/><text class="truck-pos" x="0" y="143" text-anchor="middle" id="truckText">26%</text></g>
      <path id="responseFill" class="response-shadow" d=""/><path id="responseLine" class="response-line" d=""/><line id="targetLine" class="target-line" x1="0" y1="276" x2="0" y2="418"/><text class="axis-label" x="70" y="424">左岸</text><text class="axis-label" x="1008" y="424" text-anchor="end">右岸</text><text class="bridge-label" x="550" y="256" text-anchor="middle">桥的“影子”会在揭晓后变成一张停车地图</text>
    </svg>
    <label class="sr" for="carRange">车辆位置</label><input class="fallback-range" id="carRange" type="range" min="0" max="1000" value="260">
  </section>
  <section class="dock" id="dock">
    <div class="panel"><h2>现在有多吃力</h2><div class="meter"><span id="meterFill"></span></div><div class="meter-copy"><span>还轻松</span><b id="meterValue">26%</b><span>快到顶</span></div><div class="actions"><button class="action primary" id="commit">就停这里</button><button class="action" id="hint">给一点提示</button><button class="action" id="reset">重来</button></div></div>
    <div class="panel"><h2>当前结果</h2><div class="feedback plain" id="feedback">拖动车辆，比较不同位置的数值。找到最大值以后，再换一个观察量。</div></div>
    <div class="panel" id="termPanel"><h2>工程表示</h2><div class="term" id="term"><b>影响线</b>：固定一个要观察的响应，让单位荷载沿桥移动，记录它在各个位置造成的影响。图中曲线就是当前观察量的影响线。</div><div class="actions"><button class="action twist" id="convoy">改为三辆车</button></div><div class="small">说明：本图采用线性简支梁静力模型。车辆拖动速度不参与计算。</div></div>
  </section>
</main>
<script>
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),truck=document.getElementById('truck'),watch=document.getElementById('watch');
const x0=70,x1=1030,W=x1-x0; let state={mode:'right',car:.26,watch:.5,revealed:false,unlocked:false,hint:0,convoy:false};
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ordinate(mode,x,a){if(mode==='right')return x;if(mode==='left')return 1-x;const peak=a*(1-a);if(peak<1e-9)return 0;return x<=a?x*(1-a)/peak:a*(1-x)/peak}
function axlePositions(head){return state.convoy?[head,head-.075,head-.145]:[head]}
function responseAt(head){const ps=axlePositions(head).filter(x=>x>=0&&x<=1);return ps.reduce((s,x)=>s+ordinate(state.mode,x,state.watch),0)}
function optimum(){let best={x:0,y:-1};for(let i=0;i<=1200;i++){const x=i/1200,y=responseAt(x);if(y>best.y)best={x,y}}return best}
function svgPoint(evt){const p=scene.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(scene.getScreenCTM().inverse())}
function setCar(v){state.car=clamp(v,0,1);render(false)}function setWatch(v){state.watch=clamp(v,.1,.9);state.revealed=false;render(true)}
function bindDrag(el,setter){el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);setter((svgPoint(e).x-x0)/W)});el.addEventListener('pointermove',e=>{if(el.hasPointerCapture(e.pointerId))setter((svgPoint(e).x-x0)/W)});el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setter((el===truck?state.car:state.watch)+(e.key==='ArrowRight'?.01:-.01))}})}bindDrag(truck,setCar);bindDrag(watch,setWatch);
document.getElementById('trackHit').addEventListener('pointerdown',e=>setCar((svgPoint(e).x-x0)/W));
function curvePath(){const max=optimum().y||1,base=410,amp=116;let line='',fill=`M ${x0} ${base}`;for(let i=0;i<=160;i++){const x=i/160,y=responseAt(x)/max,px=x0+x*W,py=base-y*amp;line+=(i?' L ':'M ')+px+' '+py;fill+=' L '+px+' '+py}fill+=` L ${x1} ${base} Z`;return{line,fill,max}}
function render(resetMessage){const opt=optimum(),val=responseAt(state.car),ratio=opt.y?val/opt.y:0,cx=x0+state.car*W,wx=x0+state.watch*W;truck.setAttribute('transform',`translate(${cx} 0)`);truck.setAttribute('aria-valuenow',Math.round(state.car*100));$('truckText').textContent=Math.round(state.car*100)+'%';watch.querySelector('line').setAttribute('x1',wx);watch.querySelector('line').setAttribute('x2',wx);watch.querySelector('path').setAttribute('d',`M${wx} 118v-32l35 11-35 11`);watch.querySelector('circle').setAttribute('cx',wx);watch.setAttribute('aria-valuenow',Math.round(state.watch*100));watch.style.opacity=state.mode==='bend'?1:.18;watch.style.pointerEvents=state.mode==='bend'?'auto':'none';$('meterFill').style.width=(ratio*100)+'%';$('meterValue').textContent=Math.round(ratio*100)+'%';$('carRange').value=Math.round(state.car*1000);const p=curvePath();$('responseLine').setAttribute('d',p.line);$('responseFill').setAttribute('d',p.fill);$('targetLine').setAttribute('x1',x0+opt.x*W);$('targetLine').setAttribute('x2',x0+opt.x*W);stage.classList.toggle('revealed',state.revealed);$('dock').classList.toggle('revealed-ui',state.revealed);$('dock').classList.toggle('advanced-ui',state.unlocked);if(resetMessage)$('feedback').textContent='新的目标已经选好。先拖动车，让仪表自己说话。';drawConvoy(cx)}
function drawConvoy(cx){scene.querySelectorAll('.extra-truck').forEach(n=>n.remove());if(!state.convoy)return;[.075,.145].forEach((off,i)=>{const use=document.createElementNS('http://www.w3.org/2000/svg','g');use.setAttribute('class','extra-truck');use.setAttribute('transform',`translate(${cx-off*W} 0) scale(.82)`);use.innerHTML=`<path class="truck-body" d="M-38 202h72v-26h-17l-11-18h-28l-9 18h-7z"/><path class="truck-window" d="M-18 174l5-11H3l8 11z"/><circle class="wheel" cx="-22" cy="204" r="9"/><circle class="wheel" cx="21" cy="204" r="9"/>`;truck.parentNode.insertBefore(use,truck)})}
function commit(){const opt=optimum(),ratio=responseAt(state.car)/opt.y,distance=Math.abs(state.car-opt.x);if(ratio>.975){state.revealed=true;state.unlocked=true;$('feedback').innerHTML=`<span class="good">找到了。</span>车停在桥长的 <strong>${Math.round(state.car*100)}%</strong> 附近，当前响应达到最大值的 ${Math.round(ratio*100)}%。换一个观察量，最大值位置也会随之改变。`;render(false)}else{$('feedback').innerHTML=`这里已经达到最高值的 <strong>${Math.round(ratio*100)}%</strong>。${distance>.25?'还隔得有点远；看看仪表往哪个方向会继续变亮。':'已经很接近了，再挪一点点。'}`}}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.mode=b.dataset.mode;state.revealed=false;state.hint=0;render(true)});$('commit').onclick=commit;$('hint').onclick=()=>{state.hint++;$('feedback').textContent=state.hint===1?'把车向左、向右各移动一段，比较数值变化的方向。':state.mode==='bend'?'再把车移过蓝旗，看看数值在哪一侧开始减小。':`继续向${state.mode==='right'?'右':'左'}移动，看看数值是否还在增加。`};$('reset').onclick=()=>{state.car=.26;state.watch=.5;state.revealed=false;state.unlocked=false;state.hint=0;state.convoy=false;$('convoy').textContent='改为三辆车';render(true)};$('convoy').onclick=()=>{state.convoy=!state.convoy;state.revealed=false;state.hint=0;$('convoy').textContent=state.convoy?'改回一辆车':'改为三辆车';$('feedback').textContent=state.convoy?'三辆车保持车距一起移动。比较车队在不同位置时的总响应。':'已改回单车模式。';render(false)};$('carRange').oninput=e=>setCar(e.target.value/1000);render(false);
</script>
<script src="./learning-cycle.js"></script>
</body>
</html>
