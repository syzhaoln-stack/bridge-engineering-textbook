<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>斜拉桥特殊体系：无背索与多塔刚度</title>
  <style>
    :root{--paper:#f3f7f8;--panel:#fff;--ink:#102a36;--muted:#60747c;--line:#d2dfe2;--cyan:#168da8;--cable:#64c6dd;--amber:#df962f;--coral:#cb5f4e;--green:#4d9c74;--concrete:#667780;--water:#85adbf}
    *{box-sizing:border-box}html,body{margin:0;min-width:0;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}body{padding:12px}.shell{max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.72fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 28px rgba(16,42,54,.07)}
    .top{grid-column:1/-1;display:flex;gap:12px;align-items:stretch}.question{flex:1;padding:14px 18px;border-left:5px solid var(--amber)}.question small{display:block;color:#8b5a17;font-weight:700;margin-bottom:4px}.question h1{font:600 22px/1.35 "STKaiti","KaiTi",serif;margin:0 0 6px}.question p{font-size:12px;line-height:1.62;color:var(--muted);margin:0}.tabs{width:270px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.tabs button{height:100%}
    button{border:1px solid #c5d4d8;border-radius:8px;background:#edf3f4;color:var(--ink);padding:8px 9px;min-height:42px;font-size:10px;cursor:pointer}button.active{border-color:var(--cyan);background:#dff1f4}button:focus-visible,input:focus-visible{outline:3px solid rgba(22,141,168,.24);outline-offset:2px}.diagram{padding:12px;min-width:0}.diagram-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:4px}.diagram-head b{font-size:14px}.diagram-head span{font-size:9px;color:var(--muted)}svg{display:block;width:100%;height:auto;border-radius:10px;background:#dce8ec}.desk{padding:14px}.desk h2{font-size:15px;margin:0 0 4px}.desk>p{font-size:11px;color:var(--muted);line-height:1.55;margin:0 0 9px}.row{padding:9px 10px;margin:7px 0;border:1px solid var(--line);border-radius:9px;background:#fbfcfc}.row label{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#52666e}.row output{color:var(--cyan);font-weight:700}.row input{width:100%;height:38px;accent-color:var(--cyan)}.schemes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.panel[hidden]{display:none}.metrics{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.metric{padding:10px 13px}.metric span{display:block;font-size:9px;color:var(--muted)}.metric b{display:block;margin-top:4px;color:#8d5917;font-size:15px;font-variant-numeric:tabular-nums}.reading{grid-column:1/-1;padding:14px 17px;border-top:4px solid var(--cyan)}.reading strong{display:block;color:#8b5715;margin-bottom:5px}.reading p{font-size:12px;line-height:1.72;margin:5px 0;color:#405962}.boundary{font-size:10px!important;color:#66777e!important}details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}summary{font-size:11px;color:#3c6978;cursor:pointer}details p{font-size:10px;line-height:1.6;color:var(--muted)}
    @media(max-width:850px){.shell{grid-template-columns:1fr}.top{display:grid}.tabs{width:auto}.question,.diagram,.desk,.metrics,.reading{grid-column:1}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:520px){body{padding:7px}.question h1{font-size:19px}.tabs{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.schemes{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top">
    <section class="question card"><small id="eyebrow"></small><h1 id="question"></h1><p id="intro"></p></section>
    <nav class="tabs card" aria-label="选择问题"><button data-tab="noback" class="active">没有背索，塔靠什么站住</button><button data-tab="multi">中间塔为什么特别软</button></nav>
  </div>
  <section class="diagram card"><div class="diagram-head"><b id="diagramTitle"></b><span id="diagramNote"></span></div><svg id="diagram" viewBox="0 0 900 510" role="img"></svg></section>
  <aside class="desk card">
    <div id="nobackPanel" class="panel"><h2>先动塔的后倾角</h2><p>主跨荷载与锚点位置不变。看看后倾以后，哪一个力臂变了，哪一个没有变。</p>
      <div class="row"><label>主跨由索托起的竖向力 <output id="o-v"></output></label><input id="v" type="range" min="15" max="45" step="1" value="28"></div>
      <div class="row"><label>塔向后倾 <output id="o-lean"></output></label><input id="lean" type="range" min="5" max="25" step="1" value="18"></div>
      <div class="row"><label>桥塔自重 <output id="o-towerW"></output></label><input id="towerW" type="range" min="20" max="80" step="2" value="46"></div>
      <details><summary>再试一个概念配重</summary><div class="row"><label>后侧配重 <output id="o-counter"></output></label><input id="counter" type="range" min="0" max="35" step="1" value="0"></div><p>配重只是帮助看力矩平衡的概念变量，不表示某座实桥一定采用这种构造。</p></details>
    </div>
    <div id="multiPanel" class="panel" hidden><h2>先让一边更重</h2><p>中塔左右荷载相等时，水平分量大致互相抵消；真正麻烦的是不对称。</p>
      <div class="schemes"><button data-scheme="plain" class="active">先什么都不加</button><button data-scheme="stable">加稳定索</button><button data-scheme="triangle">改成抗弯塔形</button><button data-scheme="aux">加辅助墩</button></div>
      <div class="row"><label>左右竖向分力之差 ΔV <output id="o-dv"></output></label><input id="dv" type="range" min="5" max="30" step="1" value="18"></div>
      <div class="row"><label>中塔处索角 θ <output id="o-angle"></output></label><input id="angle" type="range" min="25" max="55" step="1" value="38"></div>
      <details><summary>再改中塔本身的抗推刚度</summary><div class="row"><label>中塔等效刚度 K<sub>t</sub> <output id="o-kt"></output></label><input id="kt" type="range" min="160" max="620" step="20" value="280"></div></details>
    </div>
  </aside>
  <section class="metrics" id="metrics"></section>
  <section class="reading card"><strong id="answer"></strong><p id="explain"></p><p class="boundary" id="boundary"></p></section>
</main>
<script>
const $=id=>document.getElementById(id),P={tab:'noback',v:28,lean:18,towerW:46,counter:0,dv:18,angle:38,kt:280,scheme:'plain'};
const NS='http://www.w3.org/2000/svg';
function metric(l,v){return`<article class="metric card"><span>${l}</span><b>${v}</b></article>`}
function defs(){return`<defs><marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#cb5f4e"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168da8"/></marker><marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4d9c74"/></marker></defs>`}
function line(x1,y1,x2,y2,stroke,w=2,dash='',marker=''){return`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} ${marker?`marker-end="url(#${marker})"`:''}/>`}
function text(x,y,t,size=12,fill='#405962',anchor='start',weight=400){return`<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-weight="${weight}">${t}</text>`}
function noback(){const h=100,a=70,alpha=P.lean*Math.PI/180,e=h*Math.tan(alpha),ec=e/2,theta=Math.atan2(h,a+e),T=P.v/Math.sin(theta),H=P.v/Math.tan(theta),Mload=P.v*a,Mself=P.towerW*ec,Mcounter=P.counter*25,Mrestore=Mself+Mcounter,Mbase=Mload-Mrestore,s=2.35,bx=270,by=408,tx=bx-e*s,ty=by-h*s,ax=bx+a*s,ay=by-8;let out=defs()+`<rect x="0" y="355" width="900" height="155" fill="#85adbf" opacity=".58"/><rect x="0" y="408" width="900" height="102" fill="#43594e" opacity=".82"/>`;
  out+=line(bx,by,tx,ty,'#667780',16)+line(bx-10,by,tx-10,ty,'#93a0a5',3)+line(bx,by,700,by,'#687f91',18)+line(tx,ty,ax,ay,'#64c6dd',4)+`<circle cx="${ax}" cy="${ay}" r="6" fill="#df962f"/>`;
  out+=line(tx,ty,tx+76,ty,'#cb5f4e',3,'','arrowRed')+text(tx+82,ty+4,`H = ${H.toFixed(1)} MN`,12,'#a14538')+line(tx,ty,tx,ty+68,'#cb5f4e',3,'','arrowRed')+text(tx+8,ty+63,`V = ${P.v} MN`,12,'#a14538');
  const cx=(bx+tx)/2,cy=(by+ty)/2;out+=line(cx,cy,cx,cy+65,'#168da8',3,'','arrowBlue')+text(cx+8,cy+60,`塔重 ${P.towerW} MN`,11,'#146f84');
  if(P.counter>0){out+=`<rect x="${bx-92}" y="${by-28}" width="62" height="25" rx="4" fill="#df962f"/>`+line(bx-61,by-3,bx-61,by+38,'#df962f',3,'','arrowBlue')+text(bx-61,by-36,`配重 ${P.counter} MN`,11,'#865716','middle')}
  out+=line(bx,by+30,ax,by+30,'#dce8eb',1,'5 4')+text((bx+ax)/2,by+52,`主跨锚点离塔底 a = ${a} m`,11,'#edf4f5','middle')+text(bx-14,by-10,`后倾 ${P.lean}°`,11,'#edf4f5','end');
  const max=Math.max(Mload,Mrestore,1),bar=220/max,x0=596;out+=`<rect x="545" y="70" width="320" height="244" rx="12" fill="#f8fbfb" stroke="#cbdadd"/>`+text(565,96,'绕塔底比较力矩',14,'#173c4a','start',700)+text(565,126,'主跨把塔拉过去',11)+`<rect x="${x0}" y="139" width="${Mload*bar}" height="28" rx="5" fill="#cb5f4e"/>`+text(x0+8,159,`${Mload.toFixed(0)}`,11,'#fff','start',700)+text(565,198,'塔重与配重拉回来',11)+`<rect x="${x0}" y="211" width="${Mrestore*bar}" height="28" rx="5" fill="#4d9c74"/>`+text(x0+8,231,`${Mrestore.toFixed(0)}`,11,'#fff','start',700)+text(565,272,`基础还需平衡 ${Math.abs(Mbase).toFixed(0)} MN·m`,12,Math.abs(Mbase)<80?'#267a55':'#a14538','start',700)+text(565,294,Mbase>=0?'方向：抵抗向主跨倾覆':'方向：抵抗过多的后侧恢复力',10,'#60747c');
  $('diagram').innerHTML=out;$('metrics').innerHTML=metric('拉索倾角 θ',(theta*180/Math.PI).toFixed(1)+'°')+metric('合力 T',T.toFixed(1)+' MN')+metric('主跨倾覆力矩',Mload.toFixed(0)+' MN·m')+metric('基础余下力矩',Math.abs(Mbase).toFixed(0)+' MN·m');$('answer').textContent=`塔后倾到 ${P.lean}° 后，主跨荷载形成的倾覆力矩仍是 V×a = ${Mload.toFixed(0)} MN·m。`;$('explain').textContent=`后倾改变了索角、索力，也给桥塔自重增加了 ${ec.toFixed(1)} m 的恢复力臂；但在这个简化平衡里，拉索合力的作用线仍穿过主跨锚点，所以它对塔底的力矩只由竖向分力 V 与锚点距离 a 决定。没有背索，不等于没有平衡：桥塔自重、后倾几何、塔梁体系和基础必须把余下的力矩接住。`;}
function multi(){const theta=P.angle*Math.PI/180,dH=P.dv/Math.tan(theta),extra=P.scheme==='stable'?620:P.scheme==='aux'?470:0,kt=P.scheme==='triangle'?P.kt*2.35:P.kt,totalK=kt+extra,delta=dH/totalK,amp=900,dx=Math.min(105,delta*amp),xs=[170,450,730],baseY=405,topY=188;let out=defs()+`<rect x="0" y="356" width="900" height="154" fill="#85adbf" opacity=".58"/><rect x="0" y="405" width="900" height="105" fill="#43594e" opacity=".82"/>`+line(65,baseY,835,baseY,'#687f91',17);
  for(const x of xs){if(x===450&&P.scheme==='triangle'){out+=line(x-34,baseY,x,topY,'#667780',11)+line(x+34,baseY,x,topY,'#667780',11)+line(x-34,baseY,x+34,baseY,'#667780',9)}else out+=line(x,baseY,x,topY,'#667780',13);out+=`<rect x="${x-35}" y="${baseY}" width="70" height="16" rx="3" fill="#7d7065"/>`}
  out+=line(450,baseY,450,topY,'#eff4f5',3,'8 6')+line(450,baseY,450+dx,topY,'#cb5f4e',9)+text(456,174,'虚线：未偏移',10,'#60747c')+text(540,205,`位移放大显示 ×${amp}`,10,'#a14538');
  const anchors=[245,335,565,655];for(const x of anchors){const tower=x<450?450:450;out+=line(450+dx,topY,x,baseY-8,'#64c6dd',3)}
  out+=line(170,topY,95,baseY-8,'#64c6dd',3)+line(170,topY,260,baseY-8,'#64c6dd',3)+line(730,topY,640,baseY-8,'#64c6dd',3)+line(730,topY,805,baseY-8,'#64c6dd',3);
  if(P.scheme==='stable'){out+=line(450+dx,topY,250,baseY-8,'#df962f',5)+line(450+dx,topY,650,baseY-8,'#df962f',5)+text(450,112,'稳定索把中塔重新拉回两侧',12,'#865716','middle',700)}
  if(P.scheme==='aux'){for(const x of[335,565])out+=line(x,baseY,x,baseY+62,'#df962f',12);out+=text(450,112,'辅助墩缩短梁把不对称传来的路',12,'#865716','middle',700)}
  for(const x of[520,570,620])out+=line(x,116,x,164,'#cb5f4e',3,'','arrowRed');out+=text(570,102,'右跨更重',12,'#a14538','middle',700);
  const w=300,kScale=w/Math.max(totalK,800);out+=text(120,463,'抗推刚度从哪里来',11,'#eaf2f4')+`<rect x="275" y="449" width="${kt*kScale}" height="18" rx="4" fill="#697f93"/>`+`<rect x="${275+kt*kScale}" y="449" width="${extra*kScale}" height="18" rx="4" fill="#df962f"/>`+text(280,484,`中塔 ${kt.toFixed(0)}`,10,'#eaf2f4')+text(420,484,extra?`新增约束 ${extra}`:'没有新增约束',10,'#eaf2f4');
  $('diagram').innerHTML=out;$('metrics').innerHTML=metric('水平不平衡 ΔH',dH.toFixed(1)+' MN')+metric('中塔等效刚度',kt.toFixed(0)+' MN/m')+metric('新增约束刚度',extra.toFixed(0)+' MN/m')+metric('塔顶位移 δ',(delta*1000).toFixed(0)+' mm');const names={plain:'什么都不加',stable:'稳定索',triangle:'抗弯塔形',aux:'辅助墩'};$('answer').textContent=`采用“${names[P.scheme]}”时，这个教学模型的中塔顶位移为 ${(delta*1000).toFixed(0)} mm。`;$('explain').textContent=`左右竖向分力相差 ${P.dv} MN，在索角 ${P.angle}° 下换成约 ${dH.toFixed(1)} MN 的水平不平衡。中塔没有普通边塔那样明确的边跨背索约束，位移便主要由自身抗推刚度和额外约束接住。稳定索直接补力路；抗弯塔形提高塔本身刚度；辅助墩改变梁的支承与不对称传递。单纯把尺寸做大也能增加刚度，却未必是效率最高的办法。`;}
function render(){const isNoBack=P.tab==='noback';$('nobackPanel').hidden=!isNoBack;$('multiPanel').hidden=isNoBack;$('eyebrow').textContent=isNoBack?'看似少了一根索，其实是换了平衡办法':'先把对称拿走，问题才会露出来';$('question').textContent=isNoBack?'没有边跨背索，主跨拉索把塔往前拽，塔为什么还能站住？':'左右两跨一样重时中塔很安静；只让一边更重，它为什么突然变软？';$('intro').textContent=isNoBack?'别先背桥名。盯住塔底，把主跨拉索、桥塔自重和基础留下的力矩一笔笔对上。':'多塔斜拉桥最难的不是“塔多”，而是中塔少了普通边塔那一份背向约束。不对称荷载会把这个缺口放大。';$('diagramTitle').textContent=isNoBack?'同一个塔底：谁让它倒，谁把它拉回来':'同一个不对称荷载：约束加在哪里最有效';$('diagramNote').textContent=isNoBack?'力与尺寸按数值绘制；力矩条只作同量纲比较':'结构尺寸为概念比例；位移按标注倍数放大';$('boundary').textContent=isNoBack?'模型边界：二维刚体平衡；主跨索群合并为一根合力，桥塔视为均匀直杆，基础以余下力矩表示。未计塔梁共同变形、分索锚固、施工阶段、稳定、材料与地基非线性。概念配重不对应特定实桥。':'模型边界：把中塔纵向响应压缩为线性弹簧，ΔH=ΔV cotθ，δ=ΔH/K；不同方案的附加刚度是教学参数，只比较机制，不给真实桥型排序。未计塔梁索耦合、索垂度、几何非线性、施工阶段、动力和基础变形。';isNoBack?noback():multi();sync()}
function sync(){$('o-v').textContent=P.v+' MN';$('o-lean').textContent=P.lean+'°';$('o-towerW').textContent=P.towerW+' MN';$('o-counter').textContent=P.counter+' MN';$('o-dv').textContent=P.dv+' MN';$('o-angle').textContent=P.angle+'°';$('o-kt').textContent=P.kt+' MN/m'}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{P.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()}));document.querySelectorAll('[data-scheme]').forEach(b=>b.addEventListener('click',()=>{P.scheme=b.dataset.scheme;document.querySelectorAll('[data-scheme]').forEach(x=>x.classList.toggle('active',x===b));render()}));for(const id of['v','lean','towerW','counter','dv','angle','kt'])$(id).addEventListener('input',e=>{P[id]=+e.target.value;render()});render();
</script>
</body>
</html>
