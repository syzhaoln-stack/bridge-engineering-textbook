function slider(key,label,min,max,step,value,unit){P[key]=value;const d=document.createElement('div');d.className='row';d.innerHTML=`<label>${label}<output>${value}${unit}</output></label><input type="range" min="${min}" max="${max}" step="${step}" value="${value}">`;host.appendChild(d);const i=d.querySelector('input');i.oninput=()=>{P[key]=+i.value;d.querySelector('output').textContent=i.value+unit;build()}}
function select(key,label,items,value){P[key]=value;const d=document.createElement('div');d.className='row';d.innerHTML=`<label>${label}</label><select>${items.map(x=>`<option value="${x[0]}" ${x[0]===value?'selected':''}>${x[1]}</option>`).join('')}</select>`;host.appendChild(d);d.querySelector('select').onchange=e=>{P[key]=e.target.value;build()}}
function read(label,value){return `<div class="readout"><span>${label}</span><b>${value}</b></div>`}function zone(v,lo,hi){return v>=lo&&v<=hi?'常规区':'超出常规：仅作极端示意，须专项核验'}function header(t,q,l){$('title').textContent=t;$('question').textContent=q;$('lead').textContent=l}
function setup(){slider('span','主跨 L（全部判据基准）',60,300,10,120,' m');slider('width','桥面宽度',8,28,1,14,' m');if(mode==='beam'){header('梁桥：加高一点，究竟换来了什么？','只准调梁高：做到多深，才开始觉得“不是同一座桥了”？','梁高会提高抗弯效率，也会增加自重、建筑高度和运输施工困难。');slider('depth','主梁高度 h（常规 L/h≈15–25）',1,12,.5,4,' m')}if(mode==='arch'){header('拱桥：矢高是造型，还是受力条件？','把拱压扁，再把荷载挪到一边；哪一次变化更让它为难？','理想对称荷载下，拱能把弯曲转为压力；形状或荷载偏离后，弯矩会回来。');slider('rise','矢高 f（常规 f/L≈1/6–1/3）',10,60,2,24,' m');slider('asym','右半跨荷载增量',0,100,5,0,'%')}if(mode==='suspension'){header('悬索桥：主缆垂得低一点，会省下什么、又付出什么？','把主缆拉平，观察锚碇方向的水平拉力怎样变化。','主缆受拉很擅长跨越，但它需要锚碇、加劲梁和抗风体系共同收拾柔度。');slider('sag','主缆垂度 f（常规 f/L≈1/8–1/12）',6,28,1,12,' m');slider('stiff','加劲梁相对刚度',1,10,1,5,'级')}if(mode==='cable'){header('斜拉桥：两边拉索一样多，就一定平衡吗？','先把车压到一个边跨，再调塔高；看不对称怎样送进桥塔与主梁。','索把支点举到空中，也把竖向荷载分解成塔轴力、梁轴力和局部弯曲。');slider('sideRatio','边跨 / 主跨（常规 0.35–0.45）',.20,.55,.05,.40,'');slider('tower','桥面以上塔高 H（常规 H/L≈0.20–0.25）',12,75,1,27,' m');slider('asym','右边跨荷载增量',0,100,5,0,'%');slider('cables','每侧拉索数',4,10,1,7,'根')}if(mode==='beauty'){header('桥的比例：好看并不是把结构藏起来','先把提示藏起来，只凭比例调一遍；觉得顺眼以后，再揭示力学关系。','美有主观的一面，但秩序、尺度、细部收束和力量的可读性可以讨论。');slider('tower','塔高 H',18,75,2,38,' m');slider('depth','主梁高度 h',1,10,.5,3,' m');slider('cables','每侧拉索数',4,10,1,7,'根');$('forces').textContent='揭示力学提示';$('labels').textContent='揭示标注';$('forces').classList.remove('active');$('labels').classList.remove('active')}if(mode==='supports'){header('支座：桥不是不能动，而是要知道往哪里动','升高温度，再把活动支座锁住；那段本来可以释放的伸长去了哪里？','支座决定力和位移如何穿过边界。活动不是松散，固定也不是越多越稳。');slider('temp','温差 ΔT',-40,60,5,30,' ℃');select('supportMode','边界条件',[['guided','一端固定、一端纵向活动'],['locked','两端纵向固定']], 'guided')}if(mode==='construction'){header('施工：桥在合龙以前，先做过很多座临时的桥','拖动节段数，并故意让两侧差一段；哪一时刻桥墩最辛苦？','成桥状态不是唯一状态。悬臂施工时，结构体系、荷载和最不利截面一直在变化。');slider('stage','每侧已浇节段',1,10,1,5,'段');slider('imbalance','右侧多出的节段',0,3,1,0,'段')}}setup();
function environment(){clear(env);const L=mode==='cable'?P.span*(1+2*P.sideRatio):P.span;const g=new THREE.Mesh(new THREE.PlaneGeometry(L*2.2,130),new THREE.MeshStandardMaterial({color:C.ground,roughness:.95}));g.rotation.x=-Math.PI/2;g.position.set(L/2,-.1,0);g.receiveShadow=true;env.add(g);const w=new THREE.Mesh(new THREE.PlaneGeometry(L*1.45,48),new THREE.MeshStandardMaterial({color:C.water,transparent:true,opacity:.82,roughness:.3}));w.rotation.x=-Math.PI/2;w.position.set(L/2,0,0);env.add(w)}

function buildBeam(){const slendernessProxy=Math.pow(P.span/120,3)/Math.pow(P.depth/4,3);supports();deck(12,.035*slendernessProxy);forceHints();momentDiagram('simple');addLabel('梁高 h',P.span*.52,P.width*.45,10-P.depth/2,'#f4c876');const ratio=P.span/P.depth;ro.innerHTML=read('跨高比 L/h',ratio.toFixed(1))+read('挠跨比趋势指标',slendernessProxy.toFixed(2))+read('跨度效应','M ∝ L²');$('insight').textContent=ratio>35?'梁显得很薄，挠跨比会迅速敏感；这时往往需要体系来支援。':ratio<12?'梁很深，刚度足了，但重量、建筑高度和施工代价开始抢镜。':'此时先看刚度与自重的交换，而不是只说“越高越安全”。';$('term').innerHTML='矩形截面惯性矩量级 I∝bh³；简支均布荷载 Mmax=qL²/8。图中变形采用挠跨比代理 δ/L∝L³/h³，并经过放大，不表示绝对挠度；金色弯矩图高度固定归一化。'}
function archZ(x){const u=x/P.span;return 3+4*P.rise*u*(1-u)}function buildArch(){deck(12,.015+P.asym/1700);supports();for(const y of[-P.width*.34,P.width*.34]){const pts=[];for(let i=0;i<=48;i++){const x=P.span*i/48;pts.push([x,y,archZ(x)])}line(bridge,pts,.72,C.arch);for(let i=0;i<=12;i++){const x=P.span*i/12;line(bridge,[[x,y,archZ(x)],[x,y,12]],.25,C.edge)}}forceHints();momentDiagram('arch',P.asym);const q=50,H=q*P.span*P.span/(8*P.rise),ratio=P.span/P.rise;ro.innerHTML=read('矢跨比 f/L',(1/ratio).toFixed(3))+read('水平推力代理 H',H.toFixed(0)+' kN')+read('不对称荷载','+'+P.asym+'%');$('insight').textContent=P.asym>45?'荷载明显偏到一边，压力线和拱轴不再亲密，弯矩与侧向变形会回来。':ratio>7?'拱被压得较平，水平推力迅速放大；地基和拱座接过了代价。':'对称荷载下，合理矢高让压力更愿意沿拱圈传递。';$('term').innerHTML='教学代理：均布荷载抛物线拱 H≈qL²/(8f)。金色弯矩图仅表示不对称程度带来的趋势。真实拱桥需考虑拱上结构、活载不对称、弹性压缩、几何与材料非线性。'}
function buildSusp(){deck(12,.07*(11-P.stiff)/10);const tx=[0,P.span];tx.forEach(x=>{box(bridge,x,0,20,3,P.width*.7,40,C.tower);box(bridge,x,0,40,8,P.width*.8,2,C.tower)});for(const y of[-P.width*.42,P.width*.42]){const pts=[];for(let i=0;i<=60;i++){const u=i/60;pts.push([P.span*u,y,42-P.sag*4*u*(1-u)])}line(bridge,pts,.42,C.cable);for(let i=2;i<20;i++){const x=P.span*i/20,u=x/P.span,z=42-P.sag*4*u*(1-u);line(bridge,[[x,y,z],[x,y,12]],.12,C.cable)}}forceHints();momentDiagram('susp');const q=50,H=q*P.span*P.span/(8*P.sag);ro.innerHTML=read('垂跨比 f/L',(P.sag/P.span).toFixed(3))+read('水平索力代理 H',H.toFixed(0)+' kN')+read('加劲梁刚度',P.stiff+' / 10');$('insight').textContent=P.sag/P.span<.12?'主缆很平，水平索力明显增大；看着“利落”，锚碇未必轻松。':P.stiff<4?'加劲梁偏柔，局部车辆和风更容易留下较大的形状变化。':'主缆负责跨越，加劲梁负责把局部荷载摊开，两者不是谁替代谁。';$('term').innerHTML='教学代理：H≈qL²/(8f)。金色图表示加劲梁承担的弯矩趋势；这里没有求初始索形、吊索松弛、主缆几何非线性与气动耦合。'}
function stayCable(xt,xDeck,zTop,y){line(bridge,[[xt,y,zTop],[xDeck,y,12]],.16,C.cable)}
function cableForceBars(records){if(!showForces)return{maxDev:0,worst:records[0]};const fixedScale=500,maxH=20;let worst=records[0];for(const r of records.filter((_,i)=>i%2===0)){const targetH=Math.min(maxH,r.target/fixedScale*maxH),currentH=Math.min(maxH,r.current/fixedScale*maxH),y=-P.width*.61;box(forces,r.x,y,14+targetH/2,.46,.46,targetH,0x83949e,{transparent:true,opacity:.7});box(forces,r.x,y-1,14+currentH/2,.46,.46,currentH,Math.abs(r.dev)>15?C.compression:C.tension);if(Math.abs(r.dev)>=Math.abs(worst.dev))worst=r}addLabel('逐索索力柱：灰=设计基准，彩色=当前值',P.span*.5,-P.width*.75,35,'#dce8ec');addLabel(`关键索 ${worst.current.toFixed(0)} / ${worst.target.toFixed(0)} kN（${worst.dev>=0?'+':''}${worst.dev.toFixed(0)}%）`,worst.x,-P.width*.72,18+Math.min(maxH,worst.current/fixedScale*maxH),'#ffd08a');return{maxDev:Math.abs(worst.dev),worst}}
function buildCable(){deck(12,.025+P.asym/1250);supports();const x1=P.span*.32,x2=P.span*.68,z=12+P.tower,records=[];[x1,x2].forEach(x=>{box(bridge,x,0,12+P.tower/2,3,P.width*.65,P.tower,C.tower);box(bridge,x,0,z,7,P.width*.78,1.4,C.tower)});for(const y of[-P.width*.38,P.width*.38]){for(const xt of[x1,x2]){for(const dir of[-1,1]){const maxDist=dir*(xt-P.span/2)<0?P.span*.17:P.span*.28;for(let i=1;i<=P.cables;i++){const dist=maxDist*i/(P.cables+1),xd=xt+dir*dist,zt=z-P.tower*.05*(i/P.cables),theta=Math.atan2(zt-12,Math.abs(xd-xt)),panel=maxDist/(P.cables+1),target=60*panel/(2*Math.sin(theta)),sideFactor=xd>P.span/2?1+P.asym/100:1,current=target*sideFactor,dev=(current/target-1)*100;stayCable(xt,xd,zt,y);records.push({x:xd,target,current,dev})}}}}forceHints();momentDiagram('cable',P.asym);const bars=cableForceBars(records),theta=Math.atan(P.tower/(P.span*.28)),axial=(1+P.asym/100)*50/Math.tan(theta);if(mode==='beauty'&&!beautyRevealed){ro.innerHTML=read('当前阶段','只看比例')+read('力学读数','尚未揭示');$('insight').textContent='先凭眼睛调一次塔高、梁高和索的疏密。满意以后再揭示力学提示，看看第一次判断会不会改变。';$('term').textContent='这一轮不显示轴力、索力或公式；先把第一次判断留下来。';return}ro.innerHTML=read('梁轴力代理',axial.toFixed(0)+' kN')+read('关键索 当前 / 设计基准',bars.worst.current.toFixed(0)+' / '+bars.worst.target.toFixed(0)+' kN')+read('最大索力偏差',bars.maxDev.toFixed(0)+'%');$('insight').textContent=P.asym>45?'边跨荷载明显偏大，彩色索力柱偏离灰色基准；塔顶与主梁不再只做对称交换。':P.tower/P.span<.2?'桥塔偏矮，索更平，为同样竖向分力要付出更大的索力和梁轴力。':'均匀荷载下，当前索力与简化的均匀分担基准接近。';if(mode==='beauty'&&blindSnapshot)$('insight').textContent+=` 第一次盲调停在：塔高 ${blindSnapshot.tower} m、梁高 ${blindSnapshot.depth} m、每侧 ${blindSnapshot.cables} 根索。`;$('term').innerHTML='索力基准：假定每根索承担相邻面板的均布竖向荷载，T_ref=V/sinθ；彩色柱为加入右半跨偏载后的当前代理值 T，柱高按固定 500 kN 标尺并封顶。它不是成桥索力优化；真实斜拉桥必须由施工阶段、恒载平衡与几何非线性共同确定。'}
function buildSupports(){const L=P.span,alpha=1e-5,dL=alpha*L*P.temp,visual=dL*70;for(let i=0;i<48;i++){const x=L*(i+.5)/48+visual*(i/47-.5);box(bridge,x,0,12,L/48+.08,P.width,.52,C.deck)}for(const x of[0,L/3,2*L/3,L]){box(bridge,x,0,5.4,1.8,P.width*.72,10.8,C.pier);box(bridge,x,0,11.25,2.6,P.width*.82,.45,C.pier);const locked=P.supportMode==='locked'||x===L/3;box(bridge,x,0,11.62,locked?.8:1.35,P.width*.54,.25,locked?C.compression:C.gold)}if(showForces){const dir=Math.sign(P.temp)||1;arrow(forces,V(L*.5,0,16),V(L*.5+dir*Math.min(18,Math.abs(visual)*2),0,16),C.gold);addLabel(P.supportMode==='locked'?'热胀被边界拦住':'活动支座允许纵向位移',L*.5,0,20,P.supportMode==='locked'?'#ff9a7c':'#f3c879')}const restrained=P.supportMode==='locked'?30e9*alpha*P.temp/1e6:0;ro.innerHTML=read('自由伸缩 ΔL',(dL*1000).toFixed(1)+' mm')+read('约束应力代理',restrained.toFixed(1)+' MPa')+read('温差',P.temp+' ℃');$('insight').textContent=P.supportMode==='locked'?'桥仍然想伸长，但位移通道被封住，热变形就转成了约束内力。':'一端固定给出纵向基准，活动端把温度伸缩放出去；活动支座并不是“不受力”。';$('term').innerHTML='自由伸缩 ΔL=αLΔT；完全约束的一维代理 σ=EαΔT（取 E=30 GPa）。真实连续梁还受墩柔度、摩阻、收缩徐变与温度梯度影响。'}
function buildConstruction(){const L=P.span,x=L/2,z=12,seg=L/24,nL=P.stage,nR=P.stage+P.imbalance;box(bridge,x,0,5.5,3.2,P.width*.72,11,C.pier);box(bridge,x,0,11.3,5,P.width*.82,.5,C.pier);for(let i=0;i<nL;i++)box(bridge,x-(i+.5)*seg,0,z,seg-.12,P.width,.65,C.deck);for(let i=0;i<nR;i++)box(bridge,x+(i+.5)*seg,0,z,seg-.12,P.width,.65,C.deck);if(showForces){for(let i=0;i<nL;i++)arrow(forces,V(x-(i+.5)*seg,0,24),V(x-(i+.5)*seg,0,13),C.compression);for(let i=0;i<nR;i++)arrow(forces,V(x+(i+.5)*seg,0,24),V(x+(i+.5)*seg,0,13),C.compression);const m=(nR*(nR+1)-nL*(nL+1))/2;const h=Math.min(18,Math.abs(m)*1.2);if(h>0)arrow(forces,V(x,0,15),V(x+Math.sign(m)*h,0,15),C.gold);addLabel('墩顶不平衡弯矩',x,0,20,'#f4c876')}const imbalance=(nR*(nR+1)-nL*(nL+1))/2;ro.innerHTML=read('左悬臂',nL+' 段')+read('右悬臂',nR+' 段')+read('不平衡弯矩指标',Math.abs(imbalance).toFixed(0));$('insight').textContent=P.imbalance===0?'两侧同步向外长，墩顶的大部分施工弯矩互相抵消；这就是平衡悬臂施工的“平衡”。':'只多出一段，看起来不多，但它在更远的力臂上增加了重量，墩顶不平衡会迅速放大。';$('term').innerHTML='不平衡指标按等重节段的 Σ(W·x) 归一化，只比较趋势。真实施工分析必须逐阶段激活单元，计入龄期、预应力、挂篮、临时固结与合龙体系转换。'}
function build(){clear(bridge);clear(forces);clearLabels();environment();if(mode==='beam')buildBeam();else if(mode==='arch')buildArch();else if(mode==='suspension')buildSusp();else if(mode==='supports')buildSupports();else if(mode==='construction')buildConstruction();else buildCable();forces.visible=showForces;resetView()}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function resetView(){camera.position.set(P.span*.88,Math.max(62,P.span*.38),Math.max(85,P.width*5.5));controls.target.copy(V(P.span/2,0,15));controls.update()}$('forces').onclick=function(){showForces=!showForces;if(mode==='beauty'&&showForces&&!beautyRevealed){blindSnapshot={tower:P.tower,depth:P.depth,cables:P.cables};beautyRevealed=true}this.classList.toggle('active',showForces);if(mode==='beauty')this.textContent=showForces?'隐藏力学提示':'揭示力学提示';build()};$('labels').onclick=function(){showLabels=!showLabels;this.classList.toggle('active',showLabels);if(mode==='beauty')this.textContent=showLabels?'隐藏标注':'揭示标注'};$('view').onclick=resetView;function resizeScene(){const{w,h}=sceneSize();camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resizeScene).observe(container);build();resizeScene();$('loading').style.display='none';(function loop(){requestAnimationFrame(loop);controls.update();updateLabels();renderer.render(scene,camera)})();
</script><script>
addEventListener('DOMContentLoaded',()=>{const mode=new URLSearchParams(location.search).get('mode')||'beam',rows=[...document.querySelectorAll('#host .row')];const input=i=>rows[i]?.querySelector('input');const add=(i,fn)=>{const row=rows[i],el=document.createElement('div');el.style.cssText='margin-top:4px;font-size:10px;line-height:1.35;color:#397080';el.setAttribute('aria-live','polite');row?.append(el);const update=()=>{const r=fn();el.textContent=r.ok?'✓ 常规教学区：可比较受力趋势。':'⚠ 极端对照：只作概念比较，不能据此判断可行性。';el.style.color=r.ok?'#397080':'#b5503f'};input(i)?.addEventListener('input',update);update()};if(mode==='beam')add(2,()=>{const q=+input(0).value/+input(2).value;return{ok:q>=15&&q<=25}});if(mode==='arch')add(2,()=>{const q=+input(2).value/+input(0).value;return{ok:q>=1/6&&q<=1/3}});if(mode==='suspension')add(2,()=>{const q=+input(2).value/+input(0).value;return{ok:q>=1/12&&q<=1/8}});if(mode==='cable'){add(2,()=>{const q=+input(2).value;return{ok:q>=.35&&q<=.45}});add(3,()=>{const q=+input(3).value/+input(0).value;return{ok:q>=.20&&q<=.25}})}});
</script><script src="./learning-cycle.js"></script></body></html>
