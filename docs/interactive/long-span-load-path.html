  <style>
    :root{--paper:#f7f9f9;--ink:#102a36;--muted:#60737b;--line:#d6e1e3;--cyan:#1f8fa8;--amber:#e69b36;--coral:#c85c4a;--panel:#fff}
    *{box-sizing:border-box} html,body{margin:0;min-width:0;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--paper);color:var(--ink)} body{padding:12px}
    .lab-shell{max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.78fr);gap:12px;align-items:start}.learning-slot,.learning-result,.model-note{grid-column:1/-1}.scene-panel,.desk,.model-note{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(16,42,54,.08)}.scene-panel{overflow:hidden}
    .scene-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.12em;color:#397080;font-weight:700}.scene-head h1{font:600 20px/1.35 "STKaiti","KaiTi",serif;margin:4px 0}.scene-head p{font-size:12px;line-height:1.58;color:var(--muted);margin:5px 0}.layers{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.layers button{flex:1 1 110px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:9px;color:var(--muted)}.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
    button{min-height:44px;border:1px solid #c7d5d8;border-radius:8px;background:#eef3f4;color:var(--ink);padding:8px 10px;font-size:11px;cursor:pointer}button.active{border-color:var(--cyan);background:#dff1f4}button:focus-visible,input:focus-visible{outline:3px solid rgba(31,143,168,.28);outline-offset:2px}
    #scene{position:relative;width:100%;height:560px;overflow:hidden;background:#7f9cac}#scene canvas{display:block;width:100%!important;height:100%!important}.label{position:absolute;z-index:4;transform:translate(-50%,-50%);background:rgba(6,14,20,.86);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:3px 5px;font-size:10px;white-space:nowrap;pointer-events:none}.note{position:absolute;z-index:4;left:50%;bottom:10px;transform:translateX(-50%);font-size:9px;color:#e4edef;background:rgba(9,18,25,.84);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 9px;white-space:nowrap}
    .desk{padding:15px;background:#fbfcfc}.desk h2{font-size:15px;margin:0 0 4px}.desk>p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 10px}.control-grid{display:grid;grid-template-columns:1fr;gap:8px}.row{min-width:0;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.row label{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:#4f626a}.row output{color:var(--cyan);font-weight:700}.row input{width:100%;height:44px;margin:0;accent-color:var(--cyan)}.readouts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.readout{min-width:0;background:#eef3f4;border:1px solid var(--line);border-radius:8px;padding:8px}.readout span{display:block;color:var(--muted);font-size:9px}.readout b{font-size:13px;color:#9b6219;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .model-note{padding:14px 16px;border-top:3px solid var(--cyan)}.model-note::before{content:"E  TRACE ONE FORCE, THEN CHECK THE WHOLE SYSTEM";display:block;margin-bottom:8px;font-size:10px;font-weight:700;letter-spacing:.1em;color:#397080}.pathbar{padding:10px 12px;border-left:3px solid var(--amber);background:#f4f7f7;border-radius:0 8px 8px 0}.pathbar b{display:block;font-size:10px;color:#9b6219;letter-spacing:.08em;margin-bottom:4px}.pathbar div{font-size:11px;line-height:1.6;color:#3e5760}.insight{font:15px/1.6 "STKaiti","KaiTi",serif;color:#294650;margin-top:10px}.boundary{font-size:11px;line-height:1.65;color:#52676f;margin-top:7px}.boundary::before{content:"MODEL BOUNDARY: ";font-weight:700;color:#9b6219}
    @media(max-width:860px){body{padding:8px}.lab-shell{grid-template-columns:1fr}.scene-panel,.desk{grid-column:1}#scene{height:470px}.control-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.readouts{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.scene-head{padding:12px}.scene-head h1{font-size:18px}.scene-head p{font-size:11px}#scene{height:390px}.control-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.readouts{grid-template-columns:repeat(2,minmax(0,1fr))}.note{display:none}.label{font-size:9px}.desk,.model-note{padding:12px}}

</head>
<body>
  <main class="lab-shell">
    <section class="learning-slot" data-learning-cycle-mount></section>
    <section class="scene-panel" data-lab-scene aria-labelledby="title">
      <header class="scene-head"><div class="eyebrow">CONSTRUCTION / LOAD PATH / FEM MAP</div><h1 id="title"></h1><p id="lead"></p>
        <div class="layers"><button data-layer="structure" class="active" type="button">看构造</button><button data-layer="path" type="button">追一股力</button><button data-layer="fem" type="button">看单元</button></div>
        <div class="legend"><span><i class="sw" style="background:#aab8bd"></i>deck slab</span><span><i class="sw" style="background:#e3af58"></i>girder/tower</span><span><i class="sw" style="background:#67cfe8"></i>cable/hanger</span><span><i class="sw" style="background:#ef7956"></i>active path</span><span><i class="sw" style="background:#83d39d"></i>anchor/crossbeam</span></div>
      </header>
      <div id="scene"><div class="note">x = longitudinal / y = transverse / z = vertical. Drag to rotate; wheel to zoom.</div></div>
    </section>
    <aside class="desk" data-lab-controls aria-labelledby="control-title"><h2 id="control-title">改变构造和荷载</h2><p>先分清全桥长度、主跨和边跨，再沿一条高亮分支追力。</p><div class="control-grid">
      <div class="row"><label>全桥长度 L <output id="o-L"></output></label><input id="L" type="range" min="180" max="480" step="20" value="300"></div>
      <div class="row"><label id="shapeLabel">桥面以上塔高／主跨 <output id="o-shape"></output></label><input id="shape" type="range" min="20" max="25" step="1" value="22"></div>
      <div class="row"><label>荷载纵向位置 x/L <output id="o-loadX"></output></label><input id="loadX" type="range" min="5" max="95" step="1" value="56"></div>
      <div class="row"><label>荷载横向偏心 y <output id="o-loadY"></output></label><input id="loadY" type="range" min="-7" max="7" step=".5" value="2"></div>
      <div class="row"><label id="countLabel">每塔每侧索数 <output id="o-count"></output></label><input id="count" type="range" min="5" max="10" step="1" value="7"></div>
    </div><div class="readouts" id="readouts"></div></aside>
    <section class="learning-result" data-learning-result-mount></section>
    <section class="model-note"><section class="pathbar"><b>LOAD PATH / CURRENT HIGHLIGHT</b><div id="pathText"></div></section><div class="insight" id="insight"></div><div class="boundary" id="boundary"></div></section>
  </main>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    const type=new URLSearchParams(location.search).get('type')||'cable';
    const $=id=>document.getElementById(id), P={L:300,B:18,shape:22,loadX:56,loadY:2,count:7}, R=.40;
    const C={slab:0xaab8bd,shell:0x63c8df,frame:0xe3af58,cable:0x67cfe8,path:0xef7956,node:0x83d39d,pier:0x707875};
    let layer='structure';
    const V=(x,y,z)=>new THREE.Vector3(x,z,-y);
    function box(g,x,y,z,sx,sy,sz,c){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sz,sy),new THREE.MeshStandardMaterial({color:c,roughness:.58,metalness:.06}));m.position.copy(V(x,y,z));m.castShadow=m.receiveShadow=true;g.add(m);return m}
    function cyl(g,a,b,r,c){const d=b.clone().sub(a);if(d.length()<.01)return;const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),12),new THREE.MeshStandardMaterial({color:c,roughness:.42,metalness:.1}));m.position.copy(a.clone().add(b).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;g.add(m);return m}
    function tube(g,pts,r,c){const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>V(...p))),Math.max(48,pts.length*3),r,10,false),new THREE.MeshStandardMaterial({color:c,roughness:.42,metalness:.1}));m.castShadow=true;g.add(m);return m}
    function clear(g){while(g.children.length){const c=g.children[0];c.geometry?.dispose();if(Array.isArray(c.material))c.material.forEach(m=>m.dispose());else c.material?.dispose();g.remove(c)}}
    function span(){const main=P.L/(1+2*R),side=main*R;return{main,side,x1:side,x2:side+main}}
    const scene=new THREE.Scene(), container=$('scene'), camera=new THREE.PerspectiveCamera(43,1,.1,1200), renderer=new THREE.WebGLRenderer({antialias:true}), controls=new OrbitControls(camera,renderer.domElement), env=new THREE.Group(), bridge=new THREE.Group(), over=new THREE.Group(), labels=[];
    scene.background=new THREE.Color(0x7f9cac);scene.fog=new THREE.Fog(0x7f9cac,650,1500);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;container.appendChild(renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xeaf4ff,0x47594a,1.5));const sun=new THREE.DirectionalLight(0xffffff,1.35);sun.position.set(160,150,90);sun.castShadow=true;scene.add(sun,env,bridge,over);
    function label(t,x,y,z,col='#eef4f5'){const e=document.createElement('div');e.className='label';e.textContent=t;e.style.color=col;container.appendChild(e);labels.push({e,p:V(x,y,z)})}
    function clearLabels(){labels.forEach(o=>o.e.remove());labels.length=0}
    function updateLabels(){const w=container.clientWidth,h=container.clientHeight;labels.forEach(o=>{const p=o.p.clone().project(camera),ok=p.z>-1&&p.z<1&&Math.abs(p.x)<.94&&Math.abs(p.y)<.94;o.e.style.display=ok?'block':'none';if(ok){o.e.style.left=Math.max(8,Math.min(w-8,(p.x*.5+.5)*w))+'px';o.e.style.top=Math.max(8,Math.min(h-8,(-p.y*.5+.5)*h))+'px'}})}
    function arrow(a,b,c=C.path,n=1){for(let i=0;i<n;i++){const p0=a.clone().lerp(b,i/n),p1=a.clone().lerp(b,(i+.72)/n),d=p1.clone().sub(p0);if(d.length()>.1)over.add(new THREE.ArrowHelper(d.normalize(),p0,d.length(),c,Math.min(3,d.length()*.22),.8))}}
    function environment(){clear(env);const ground=new THREE.Mesh(new THREE.PlaneGeometry(P.L*1.8,150),new THREE.MeshStandardMaterial({color:0x293d35,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.set(P.L/2,-.2,0);env.add(ground);const water=new THREE.Mesh(new THREE.PlaneGeometry(P.L*1.4,72),new THREE.MeshStandardMaterial({color:0x315f79,transparent:true,opacity:.82}));water.rotation.x=-Math.PI/2;water.position.set(P.L/2,-.08,0);env.add(water)}
    function deck(z){for(let i=0;i<48;i++)box(bridge,P.L*(i+.5)/48,0,z,P.L/48+.05,P.B,.38,C.slab);for(const y of[-P.B*.38,P.B*.38])box(bridge,P.L/2,y,z-1.15,P.L,.65,2.3,C.frame);for(let i=0;i<=24;i++)box(bridge,P.L*i/24,0,z-.75,.62,P.B*.9,1.25,C.frame);for(const y of[-2.2,2.2])box(bridge,P.L/2,y,z+.28,P.L,.18,.08,0xf3e7bc)}
    function tower(x,z,zTop){const y=P.B*.58;for(const s of[-1,1]){cyl(bridge,V(x,s*y,1.6),V(x,s*y,zTop),1.1,C.frame);box(bridge,x,s*y,z,4,3.4,3.2,C.node)}cyl(bridge,V(x,-y,zTop),V(x,y,zTop),1,C.frame);box(bridge,x,0,.8,13,P.B*1.45,1.8,C.pier)}
    function towerFoundation(x){box(bridge,x,-P.B*.56,6,5,4.2,12,C.pier);box(bridge,x,P.B*.56,6,5,4.2,12,C.pier);box(bridge,x,0,.8,12,P.B*1.35,1.6,C.pier)}
    function endSupportAndAnchorage(x,z){box(bridge,x,0,5,13,P.B*1.42,8,C.pier);box(bridge,x,0,z-2.9,4.4,P.B*.78,5.2,C.pier);box(bridge,x,0,z-.58,5.2,P.B*.88,.72,C.node)}
    function cableStayed(z){const s=span(), rise=s.main*P.shape/100,zTop=z+rise,rec=[],deckAnchors=new Set,towerAnchors=new Set;[s.x1,s.x2].forEach(xt=>{towerFoundation(xt);tower(xt,z,zTop);[-1,1].forEach(dir=>{const outward=dir*(xt-P.L/2)>0,max=outward?s.side*.88:s.main*.48;for(let i=1;i<=P.count;i++){const xd=xt+dir*max*i/(P.count+1),zt=z+rise*(.58+.32*i/(P.count+1)),tk=xt.toFixed(4)+'/'+zt.toFixed(4),dk=xd.toFixed(4);if(!towerAnchors.has(tk)){box(bridge,xt,0,zt,1.35,P.B*1.30,.86,C.node);towerAnchors.add(tk)}if(!deckAnchors.has(dk)){box(bridge,xd,0,z-.48,.86,P.B*1.06,.78,C.node);deckAnchors.add(dk)}for(const y of[-P.B*.5,P.B*.5]){cyl(bridge,V(xt,y,zt),V(xd,y,z),.18,C.cable);rec.push({xt,xd,y,zt})}}})});
      if(layer==='structure'){label('双索面：桥面锚固横梁 → 塔上锚固横梁',P.L*.48,P.B*.5,z+rise*.55,'#9eeaff');label('H 形桥塔：塔腿位于车行区外',s.x1,0,zTop+7,'#f3ca7a')}return{...s,rise,zTop,rec,deckAnchorCount:deckAnchors.size,towerAnchorCount:towerAnchors.size}}
    function suspension(z){const s=span(),rise=s.main*P.shape/100,zTop=z+rise,sag=s.main/10,hang=[],stations=new Set,sideZ=u=>5+(zTop-5)*(.14*u+.86*u*u),deckAnchor=x=>{const k=x.toFixed(4);if(!stations.has(k)){box(bridge,x,0,z-.48,.72,P.B*1.04,.72,C.node);stations.add(k)}};towerFoundation(s.x1);towerFoundation(s.x2);tower(s.x1,z,zTop);tower(s.x2,z,zTop);endSupportAndAnchorage(0,z);endSupportAndAnchorage(P.L,z);
      for(const y of[-P.B*.5,P.B*.5]){const mainPts=[],left=[],right=[];for(let i=0;i<=60;i++){const u=i/60;mainPts.push([s.x1+s.main*u,y,zTop-4*sag*u*(1-u)])}for(let i=0;i<=24;i++){const u=i/24;left.push([s.x1*u,y,sideZ(u)]);right.push([s.x2+s.side*u,y,sideZ(1-u)])}tube(bridge,mainPts,.38,C.cable);tube(bridge,left,.38,C.cable);tube(bridge,right,.38,C.cable);const n=Math.max(12,P.count*2);for(let i=1;i<n;i++){const u=i/n,x=s.x1+s.main*u,zc=zTop-4*sag*u*(1-u);cyl(bridge,V(x,y,z),V(x,y,zc),.12,C.cable);deckAnchor(x);hang.push({x,y,zc,side:false})}for(const sign of[-1,1])for(let i=1;i<P.count;i++){const u=i/P.count,x=sign<0?s.x1*u:s.x2+s.side*u,zc=sideZ(sign<0?u:1-u);if(zc>z+.65){cyl(bridge,V(x,y,z),V(x,y,zc),.12,C.cable);deckAnchor(x);hang.push({x,y,zc,side:true,left:sign<0})}}}
      if(layer==='structure'){label('主缆与边跨吊索',P.L*.5,P.B*.5,zTop-sag+9,'#9eeaff');label('锚碇与端支承',0,0,10,'#f3ca7a')}return{...s,rise,zTop,sag,hang,hangerCount:stations.size}}
    function fem(z,data){for(let i=0;i<=24;i++)for(let j=0;j<=4;j++){const x=P.L*i/24,y=-P.B/2+j*P.B/4;const node=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),new THREE.MeshStandardMaterial({color:C.node}));node.position.copy(V(x,y,z+.4));over.add(node);if(i<24)cyl(over,V(x,y,z+.4),V(x+P.L/24,y,z+.4),.035,C.shell);if(j<4)cyl(over,V(x,y,z+.4),V(x,y+P.B/4,z+.4),.035,C.shell)}label('板壳：桥面｜空间梁：主梁、横梁和塔｜杆索：拉索',data.x1,-P.B*.58,data.zTop+7,'#f3ca7a')}
    const read=(l,v)=>`<div class="readout"><span>${l}</span><b>${v}</b></div>`;
    function defaultText(data){const spansText=read('全桥长度 L',P.L.toFixed(1)+' m')+read('主跨 M',data.main.toFixed(1)+' m')+read('每侧边跨 S',data.side.toFixed(1)+' m');if(type==='cable'){$('readouts').innerHTML=spansText+read('塔高／主跨',(data.rise/data.main).toFixed(2));$('insight').textContent='每根斜拉索在桥面端落到横贯桥宽的锚固横梁，在塔端落到连接两根塔腿的锚固横梁。离塔越远的桥面锚点，配得越高，避免同一索面相互交叉。'}else{$('readouts').innerHTML=spansText+read('垂度／主跨','1/10');$('insight').textContent='主缆越过两座桥塔后继续通向端部锚碇。边跨中主缆高于桥面的地方设吊索；靠近桥端的短段由端支承明确接住。'}}
    function loadPath(z,data){const x=P.L*P.loadX/100,y=P.loadY,yp=y>=0?P.B*.5:-P.B*.5;arrow(V(x,y,z+13),V(x,y,z+1));arrow(V(x,y,z+.9),V(x,yp,z+.35));if(type==='cable'){const r=data.rec.reduce((a,b)=>Math.abs(b.xd-x)+Math.abs(b.y-yp)<Math.abs(a.xd-x)+Math.abs(a.y-yp)?b:a);arrow(V(r.xd,r.y,z+.3),V(r.xt,r.y,r.zt),C.path,4);arrow(V(r.xt,r.y,r.zt),V(r.xt,r.y,2),0xf0ad55,3);arrow(V(x,yp,z-.7),V(r.xt,yp,z-.7),0xe7b45c,3);const th=Math.atan2(r.zt-z,Math.abs(r.xt-r.xd)),dN=800*.55/Math.sin(th);$('readouts').innerHTML=read('索力参考值','2800 kN')+read('示意分担比例','55%')+read('索力增量示意',dN.toFixed(0)+' kN')+read('塔高／主跨',(data.rise/data.main).toFixed(2));$('insight').textContent='橙色只追一条教学分支：桥面板 → 横梁与主梁 → 选中的斜拉索 → 塔腿 → 基础。拉索的水平分量仍要留在主梁体系里取得平衡。'}else{const h=data.hang.reduce((a,b)=>Math.abs(b.x-x)+Math.abs(b.y-yp)<Math.abs(a.x-x)+Math.abs(a.y-yp)?b:a);arrow(V(h.x,h.y,z+.3),V(h.x,h.y,h.zc),C.path,2);const near=h.x<(data.x1+data.x2)/2?data.x1:data.x2;arrow(V(h.x,h.y,h.zc),V(near,h.y,data.zTop),C.path,3);arrow(V(near,h.y,data.zTop),V(near,h.y,2),0xf0ad55,3);if(h.side){const a=near===data.x1?0:P.L;arrow(V(near,h.y,data.zTop),V(a,h.y,5),0xe7b45c,3)}else{const far=near===data.x1?data.x2:data.x1;arrow(V(h.x,h.y,h.zc),V(far,h.y,data.zTop),0xe7b45c,3);arrow(V(data.x1,h.y,data.zTop),V(0,h.y,5),C.path,3);arrow(V(data.x2,h.y,data.zTop),V(P.L,h.y,5),0xe7b45c,3)}const H=55*data.main*data.main/(8*data.sag);$('readouts').innerHTML=read('均布荷载下的 H 基准',H.toFixed(0)+' kN')+read('示意分担比例','50%')+read('索力增量示意','400 kN')+read('垂度／主跨','1/10');$('insight').textContent='高亮只追一条教学分支：桥面 → 加劲梁与横梁 → 附近吊索 → 主缆。塔腿主要接竖向分量，端部锚碇接住水平分量。'}label('当前轮载',x,y,z+14,'#ffb09a')}
    function resetView(){camera.position.set(P.L*1.32,Math.max(150,P.L*.72),Math.max(175,P.L*.78));controls.target.copy(V(P.L/2,0,24));controls.update()}
    function sync(){const s=span();$('o-L').textContent=P.L+' m';$('o-shape').textContent=P.shape+'% / '+(s.main*P.shape/100).toFixed(1)+' m';$('o-loadX').textContent=P.loadX+'%';$('o-loadY').textContent=P.loadY.toFixed(1)+' m';$('o-count').textContent=P.count}
    function build(){sync();clear(bridge);clear(over);clearLabels();environment();const z=16,data=type==='cable'?cableStayed(z):suspension(z);if(layer==='path')loadPath(z,data);else defaultText(data);if(layer==='fem')fem(z,data);$('pathText').textContent=type==='cable'?'桥面 → 横梁与主梁 → 多根斜拉索（图中只高亮一根）→ 塔腿 → 基础。':'桥面 → 横梁与加劲梁 → 附近吊索 → 主缆 → 桥塔与端部锚碇。';$('boundary').textContent=type==='cable'?'边跨固定为主跨的 0.40；桥面以上塔高按主跨的 0.20–0.25 控制。图中受力数值只用于数量级教学，不是完成的索力设计。':'主跨主缆采用 f/M = 1/10。水平分力基准假定均布恒载；真实分析还需要找形、刚度、几何非线性与施工阶段。';resetView()}
    function resize(){const w=Math.max(1,container.clientWidth),h=Math.max(1,container.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
    if(type==='cable'){$('title').textContent='斜拉桥：把一股力追到真实的锚固位置';$('lead').textContent='滑杆给的是全桥长度 L，几何比例却以主跨 M 为基准。每侧边跨固定为 0.40M；桥面以上塔高为 0.20–0.25M。'}else{$('title').textContent='悬索桥：主缆为什么必须走到锚碇';$('lead').textContent='先把全桥长度、主跨和边跨分开。主跨主缆默认采用垂跨比 f/M = 1/10。';$('shape').min=16;$('shape').max=25;$('shape').value=20;P.shape=20;$('countLabel').firstChild.nodeValue='主跨吊索密度 '}
    for(const k of ['L','shape','loadX','loadY','count'])$(k).addEventListener('input',e=>{P[k]=+e.target.value;build()});document.querySelectorAll('[data-layer]').forEach(b=>b.addEventListener('click',()=>{layer=b.dataset.layer;document.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('active',x===b));build()}));new ResizeObserver(resize).observe(container);build();resize();(function loop(){requestAnimationFrame(loop);controls.update();updateLabels();renderer.render(scene,camera)})();
  </script>
  <script src="./learning-cycle.js"></script>
</body>
