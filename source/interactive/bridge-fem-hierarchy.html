位',P.span*.48,0,12.5,'#87e5f4');label(`主跨 ${mainSpan.toFixed(1)} m；塔高/主跨 = 0.22`,P.span/2,0,topZ+2,'#f4ca79');label('truss3d 拉索：塔端锚固区 → 横梁节点',towerXs[1],ys[1],deckZ+towerAboveDeck*.75,'#ff9c80');setMap([['桥面板','shell4','局部与整体桥面响应'],['纵梁/横梁/桥塔','frame3d（同站位节点）','轴力、双向弯矩、扭矩'],['斜拉索','truss3d（塔锚区→横梁节点）','轴力增量与总索力'],['锚固/支座局部','局部壳/实体子模型','全桥模型不解析局部三维应力']]);setText(`这是按比例布置的混合全桥母型：主跨 ${mainSpan.toFixed(1)} m，桥面以上塔高 ${towerAboveDeck.toFixed(1)} m（0.22 × 主跨）。它用拓扑示意表达单元连接，不能替代施工详图或索力成桥分析。`,'比例模型保留主跨、塔高、锚固区和构件连接；简化的是截面、锚具细部与真实索力。索桥若要给真实索力，仍须建立恒载线形、初始索力和几何刚度。')}
function setMap(rows){$('mapping').innerHTML='<div class="hd">实桥构件</div><div class="hd">有限元对象</div><div class="hd">主要能回答</div>'+rows.map(r=>`<div><b>${r[0]}</b></div><div>${r[1]}</div><div>${r[2]}</div>`).join('')}function setText(a,b){$('insight').textContent=a;$('boundary').textContent=b}function build(){clear(model);clear(anno);clearLabels();hybridInfo=null;environment();if(mode==='physical')physical();if(mode==='grillage')grillage();if(mode==='shell')shell();if(mode==='hybrid')hybrid();const counts=mode==='shell'||mode==='hybrid'?{nodes:(P.nx+1)*(P.ny+1),elems:P.nx*P.ny}:{nodes:Math.round(P.span/P.cross+1)*4,elems:Math.round(P.span/P.cross)*4};$('readouts').innerHTML=`<div class="readout"><span>当前层级</span><b>${{physical:'实桥构件',grillage:'梁格',shell:'板壳',hybrid:'混合'}[mode]}</b></div><div class="readout"><span>显示节点</span><b>${mode==='physical'?'—':counts.nodes}</b></div><div class="readout"><span>面/线单元量级</span><b>${mode==='physical'?'—':counts.elems}</b></div>${hybridInfo?`<div class="readout"><span>主跨 / 桥面以上塔高</span><b>${hybridInfo.mainSpan.toFixed(1)} / ${hybridInfo.towerAboveDeck.toFixed(1)} m</b></div>`:''}`;resetView()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));build()});for(const k of['span','cross','loadY'])$(k).oninput=e=>{P[k]=+e.target.value;$('o-'+k).textContent=e.target.value+(k==='loadY'?' m':' m');build()};$('mesh').onchange=e=>{[P.nx,P.ny]=e.target.value.split(',').map(Number);build()};function resetView(){scene.fog.near=P.span*1.2;scene.fog.far=P.span*3.2;camera.position.set(P.span*.78,Math.max(40,P.span*.40),Math.max(52,P.span*1.0));controls.target.copy(V(P.span/2,0,12));controls.update()}function resizeScene(){const{w,h}=sceneSize();camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resizeScene).observe(container);build();resizeScene();$('loading').style.display='none';(function loop(){requestAnimationFrame(loop);controls.update();updateLabels();renderer.render(scene,camera)})();
