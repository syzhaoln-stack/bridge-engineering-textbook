<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桥梁基本判断实验台</title>
<style>
:root{--bg:#0b131b;--panel:#14212c;--line:#334957;--text:#edf3f4;--muted:#9cabb4;--cyan:#65cee7;--orange:#ee7c55;--gold:#e8b85f;--green:#79d5a0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{background:radial-gradient(circle at 20% 0,#1a3443 0,transparent 44%),var(--bg)}main{min-height:700px;padding:20px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--cyan)}h1{font-family:"STKaiti","KaiTi",serif;font-size:27px;font-weight:600;margin:5px 0 7px}.lead{font-size:13px;line-height:1.65;color:#b7c4ca;max-width:720px}.badge{font-size:11px;border:1px solid var(--line);padding:7px 10px;color:#b9c6cc}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;margin-top:16px}.scene,.controls,.result{background:rgba(18,31,41,.92);border:1px solid var(--line);box-shadow:0 14px 35px rgba(0,0,0,.23)}.scene{min-height:430px;padding:12px;position:relative}.scene svg{display:block;width:100%;height:405px}.controls{padding:15px}.controls h2,.result h2{font-size:11px;letter-spacing:.13em;color:#92a7b1;margin:0 0 12px}.row{margin:12px 0}.row label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#c5d0d4}.row output{color:var(--cyan);font-variant-numeric:tabular-nums}.row input[type=range]{width:100%;margin-top:7px;accent-color:var(--orange)}select,button{width:100%;border:1px solid #48606e;background:#1d303e;color:#eaf1f3;padding:8px;font-size:12px}button{cursor:pointer;margin-top:7px}button:hover{border-color:var(--cyan)}.result{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 16px}.plain{font-family:"STKaiti","KaiTi",serif;font-size:17px;line-height:1.6}.term{font-size:12px;line-height:1.65;color:#bac8ce;border-left:2px solid var(--cyan);padding-left:12px}.term b{color:var(--cyan)}.metric{font:700 22px/1.2 "Arial Narrow",sans-serif;color:var(--gold)}.minor{font-size:10px;color:#81939d;margin-top:7px}.axis{stroke:#72838c;stroke-width:1}.grid{stroke:#2a3d49;stroke-width:1}.mainline{stroke:var(--cyan);stroke-width:4;fill:none}.secondary{stroke:var(--orange);stroke-width:3;fill:none}.gold{stroke:var(--gold);fill:none;stroke-width:2}.fill{fill:rgba(101,206,231,.12);stroke:var(--cyan);stroke-width:2}.label{fill:#dce6e9;font-size:12px}.muted{fill:#91a4ad;font-size:11px}.load{stroke:var(--orange);stroke-width:3;marker-end:url(#arrow)}.node{fill:#203644;stroke:#78d1e5;stroke-width:2}.node.off{stroke:#d35d52;fill:#3a2225}.choice{display:flex;gap:6px}.choice button{margin:0}.choice button.on{background:#285164;border-color:var(--cyan)}
@media(max-width:760px){main{padding:12px}.head{display:block}.badge{display:inline-block;margin-top:8px}.layout{grid-template-columns:1fr}.scene{min-height:340px}.scene svg{height:320px}.result{grid-template-columns:1fr}h1{font-size:23px}.controls{padding:12px}}
</style></head><body><main>
<header class="head"><div><div class="eyebrow" id="eyebrow">BRIDGE INSIGHT LAB</div><h1 id="title"></h1><div class="lead" id="lead"></div></div><div class="badge" id="badge"></div></header>
<div class="layout"><section class="scene"><svg id="svg" viewBox="0 0 900 420" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ee7c55"/></marker></defs><g id="drawing"></g></svg></section><aside class="controls"><h2>PARAMETERS / 可调条件</h2><div id="controlHost"></div></aside><section class="result"><div><h2>先用眼睛判断</h2><div class="plain" id="plain"></div></div><div><h2>对应的力学关系</h2><div class="term" id="term"></div><div class="minor" id="boundary"></div></div></section></div>
</main><script>
const qs=new URLSearchParams(location.search),mode=qs.get('mode')||'crossing',host=document.getElementById('controlHost'),D=document.getElementById('drawing');
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function slider(key,label,min,max,step,value,unit=''){const d=document.createElement('div');d.className='row';d.innerHTML=`<label>${label}<output id="o-${key}">${value}${unit}</output></label><input id="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${value}">`;host.appendChild(d);const i=d.querySelector('input');i.dataset.unit=unit;i.oninput=()=>{d.querySelector('output').textContent=i.value+unit;render()};return i}
function select(key,label,items){const d=document.createElement('div');d.className='row';d.innerHTML=`<label>${label}</label><select id="${key}">${items.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>`;host.appendChild(d);d.querySelector('select').onchange=render;return d.querySelector('select')}
function setup(t,l,b){$('title').textContent=t;$('lead').textContent=l;$('badge').textContent=b}
const conf={};
function crossing(){setup('同一条河，为什么斜着跨会突然变贵？','先把路线方向和河岸夹角调一调。桥并没有“更想做长”，只是它要跨过的几何距离变了。','第 1 章 · 过河之前');conf.B=slider('B','河面法向宽度 B',40,300,5,120,' m');conf.a=slider('a','路线与河岸夹角 α',15,90,1,70,'°')}
function scale(){setup('把桥放大十倍，哪些东西没有一起长大？','蜘蛛侠和哥斯拉都提醒我们：相似的外形，不保证相似的受力处境。拖动尺度，再选择你准备怎样“补救”。','第 2 章 · 先猜数量级');conf.lam=slider('lam','线性尺度 λ',1,20,.5,4,'×');conf.strategy=select('strategy','截面策略',[['similar','保持几何相似'],['deeper','梁高额外增加'],['lighter','换更轻的材料']])}
function forcepath(){setup('拿掉一个连接，重量还能找到地面吗？','荷载并不认识“主梁”“桥墩”这些名字。它只会沿着刚度和连接，把力一站一站送到地基。试着拿掉一条支路，看另一条是不是还在。','第 5 章 · 力走哪条路');conf.kind=select('kind','观察哪一种桥',[['beam','梁桥'],['arch','拱桥'],['cable','斜拉桥']]);const d=document.createElement('div');d.className='row';d.innerHTML='<label>临时拿掉一个环节</label><div class="choice"><button data-cut="none" class="on">不拿</button><button data-cut="middle">中间连接</button><button data-cut="support">一侧支承</button></div>';host.appendChild(d);conf.cut='none';d.querySelectorAll('button').forEach(b=>b.onclick=()=>{conf.cut=b.dataset.cut;d.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()})}
function curve(){setup('绳子、拱和均布荷载，为什么总爱遇见抛物线？','先换荷载，再看“只受拉的绳”愿意长成什么样。形状不是装饰，它是荷载留下的笔迹。','第 10 章 · 曲线从荷载里长出来');conf.load=select('load','荷载怎样分布',[['uniform','沿水平投影均布'],['half','只压左半边'],['point','跨中一个集中力']]);conf.sag=slider('sag','跨中垂度 / 矢高',30,140,5,80,' px')}
({crossing,scale,forcepath,curve}[mode]||crossing)();
function render(){if(mode==='crossing')drawCrossing();if(mode==='scale')drawScale();if(mode==='forcepath')drawPath();if(mode==='curve')drawCurve()}
function drawCrossing(){const B=+conf.B.value,a=+conf.a.value*Math.PI/180,L=B/Math.sin(a),x0=170,y0=335,x1=x0+Math.cos(a)*L*1.45,y1=y0-Math.sin(a)*L*1.45;D.innerHTML=`<path d="M0 110 L900 20 L900 205 L0 295Z" fill="#173b4b"/><path d="M0 110 L900 20M0 295L900 205" class="gold"/><path d="M${x0} ${y0}L${x1} ${y1}" class="mainline"/><path d="M${x0} ${y0}L${x0} ${y0-B*1.45}" class="secondary"/><text x="50" y="80" class="muted">对岸</text><text x="740" y="350" class="muted">此岸</text><text x="${x0+15}" y="${y0-B*.72}" class="label">B = ${B} m</text><text x="${(x0+x1)/2+10}" y="${(y0+y1)/2-12}" class="label">实际桥长 ≈ ${L.toFixed(1)} m</text><path d="M${x0+55} ${y0}A55 55 0 0 0 ${x0+55*Math.cos(a)} ${y0-55*Math.sin(a)}" class="gold"/>`;$('plain').innerHTML=`斜交角降到 <span class="metric">${Math.round(a*180/Math.PI)}°</span>，桥长变成河宽的 <span class="metric">${(L/B).toFixed(2)} 倍</span>。桥长每多一点，梁的弯矩、材料和施工边界都不会只多“一点”。`;$('term').innerHTML=`<b>斜交跨越：</b>若 α 是路线与河岸方向的夹角，最简几何关系为 L=B/sinα。α 越小，跨越长度增长越快。`;$('boundary').textContent='边界：只表达平面几何；尚未计入河床、净空、接线纵坡和桥台布置。'}
function drawScale(){const l=+conf.lam.value,s=conf.strategy.value;let w=Math.pow(l,3),moment=Math.pow(l,4),cap=Math.pow(l,3);if(s==='deeper')cap=Math.pow(l,3.55);if(s==='lighter')w*=.55,moment*=.55;const vals=[['自重',w,'#ee7c55'],['弯矩需求',moment,'#e8b85f'],['相似截面能力',cap,'#65cee7']],max=Math.max(...vals.map(v=>Math.log10(v[1])));D.innerHTML=`<line x1="95" y1="350" x2="850" y2="350" class="axis"/>${vals.map((v,i)=>{const h=270*Math.log10(v[1])/Math.max(max,.1),x=155+i*225;return `<rect x="${x}" y="${350-h}" width="105" height="${h}" fill="${v[2]}" opacity=".82"/><text x="${x+52}" y="375" text-anchor="middle" class="label">${v[0]}</text><text x="${x+52}" y="${338-h}" text-anchor="middle" class="label">× ${v[1].toFixed(v[1]>999?0:1)}</text>`}).join('')}<path d="M60 350H870M60 80V350" class="grid"/>`;$('plain').innerHTML=`外形放大 <span class="metric">${l} 倍</span> 后，自重约为原来的 <span class="metric">${w.toFixed(0)} 倍</span>，弯矩需求约为 <span class="metric">${moment.toFixed(0)} 倍</span>。${s==='similar'?'几何相似没有自动补上这道差距。':s==='deeper'?'额外加高确实追上了一部分，但运输、稳定和施工也会跟着变。':'轻材料压低了自重系数，却没有改变尺度指数本身。'}`;$('term').innerHTML=`<b>尺度律：</b>几何相似时，长度按 λ、面积按 λ²、体积和自重按 λ³；自重引起的弯矩量级还要再乘一个长度，约按 λ⁴。`;$('boundary').textContent='边界：数量级比较，不代替具体截面、材料非线性、局部稳定与规范验算。'}
function reachesGround(nodeCount,edges,removed,grounds,start=0){const adj=Array.from({length:nodeCount},()=>[]);edges.forEach((e,i)=>{if(removed.has(i))return;adj[e[0]].push(e[1]);adj[e[1]].push(e[0])});const seen=new Set([start]),queue=[start];while(queue.length){const n=queue.shift();for(const next of adj[n])if(!seen.has(next)){seen.add(next);queue.push(next)}}return{reachable:grounds.some(n=>seen.has(n)),seen}}
function drawPath(){const k=conf.kind.value,cut=conf.cut,nodes=k==='beam'?[[450,75,'车'],[450,175,'桥面'],[450,260,'主梁'],[250,335,'左支座'],[650,335,'右支座']]:k==='arch'?[[450,70,'车'],[450,160,'桥面'],[450,245,'拱圈'],[220,335,'左拱座'],[680,335,'右拱座']]:[[450,65,'车'],[450,145,'桥面'],[320,225,'左斜拉索'],[580,225,'右斜拉索'],[450,325,'桥塔/基础']],edges=k==='cable'?[[0,1],[1,2],[1,3],[2,4],[3,4]]:[[0,1],[1,2],[2,3],[2,4]],grounds=k==='cable'?[4]:[3,4],removed=new Set();if(cut==='middle')removed.add(1);if(cut==='support')removed.add(edges.length-1);const check=reachesGround(nodes.length,edges,removed,grounds);let html=edges.map((e,i)=>{const a=nodes[e[0]],b=nodes[e[1]],off=removed.has(i);return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${off?'#d35d52':'#65cee7'}" stroke-width="${off?3:6}" stroke-dasharray="${off?'8 8':'0'}"/>`}).join('');html+=nodes.map(n=>`<g><circle cx="${n[0]}" cy="${n[1]}" r="29" class="node"/><text x="${n[0]}" y="${n[1]+4}" text-anchor="middle" class="label">${n[2]}</text></g>`).join('')+`<line x1="450" y1="10" x2="450" y2="45" class="load"/>`;D.innerHTML=html;if(cut==='none'){$('plain').innerHTML=`荷载从桥面进入承重构件，再经支承或索塔送进地基。现在至少有一条<span class="metric">连续的传力路径</span>。`}else if(check.reachable){$('plain').innerHTML=`红色虚线拿掉了一条支路，另一条仍能把荷载送到地面。结构没有立刻变成“无路可走”，但<span class="metric">内力会重新分配</span>。`}else{$('plain').innerHTML=`红色虚线切断了荷载点通往所有地基节点的连接。图还像一座桥，<span class="metric">力却到不了地面</span>。`}$('term').innerHTML=`<b>传力路径与冗余：</b>从荷载作用点到地基反力之间必须存在连续路径；一条路径失效后仍有其他路径可达，才体现了拓扑层面的替代性。`;$('boundary').textContent='边界：这是连通性图，只回答“有没有路”；线宽不代表内力，也不回答剩余路径的刚度、承载力和动力效应。'}
function drawCurve(){const t=conf.load.value,s=+conf.sag.value,L=650,x0=125,y0=110;let pts=[];for(let i=0;i<=100;i++){const x=i/100;let y;if(t==='uniform')y=4*s*x*(1-x);else if(t==='half')y=x<.5?3.2*s*x*(1-.75*x):s*(1-x)*1.05;else y=2*s*Math.min(x,1-x);pts.push([x0+x*L,y0+y])}const p=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');D.innerHTML=`<line x1="${x0}" y1="${y0}" x2="${x0+L}" y2="${y0}" class="axis"/><path d="${p}" class="mainline"/><circle cx="${x0}" cy="${y0}" r="7" fill="#e8b85f"/><circle cx="${x0+L}" cy="${y0}" r="7" fill="#e8b85f"/>${Array.from({length:t==='point'?1:9},(_,i)=>{const x=t==='point'?x0+L/2:x0+L*(i+1)/10;return `<line x1="${x}" y1="35" x2="${x}" y2="${t==='half'&&i>3?70:90}" class="load"/>`}).join('')}<text x="450" y="390" text-anchor="middle" class="muted">蓝线是柔索在这组荷载下寻找的平衡形状</text>`;$('plain').innerHTML=t==='uniform'?`荷载均匀铺开时，曲线平顺而对称，接近一条<span class="metric">抛物线</span>。`:t==='half'?`只压一边，曲线就不肯再保持对称。荷载变了，合理形状也跟着变。`:`一个集中力把曲线折出尖点；用一条光滑抛物线去解释它，已经漏掉了关键信息。`;$('term').innerHTML=`<b>索形与压力线：</b>柔索在给定荷载下以受拉形状平衡；把形状倒过来，可帮助理解理想拱轴线。但只有特定荷载下才会吻合。`;$('boundary').textContent='边界：为教学示意，非几何非线性索单元求解；不用于索力、锚碇或施工初始状态设计。'}
function pathSelfTest(){const beam=[[0,1],[1,2],[2,3],[2,4]],cable=[[0,1],[1,2],[1,3],[2,4],[3,4]];console.assert(reachesGround(5,beam,new Set([3]),[3,4]).reachable,'beam keeps one support path');console.assert(!reachesGround(5,beam,new Set([1]),[3,4]).reachable,'beam middle cut disconnects both grounds');console.assert(reachesGround(5,cable,new Set([1]),[4]).reachable,'cable keeps parallel branch');console.assert(!reachesGround(5,cable,new Set([1,2]),[4]).reachable,'both cable branches removed')}
window.fundamentalsForcePath={reachesGround};pathSelfTest();render();
</script><script src="./learning-cycle.js"></script></body></html>
