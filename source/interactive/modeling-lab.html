<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风、模型与有限元实验台</title><style>
:root{--bg:#0b141c;--panel:#14232d;--line:#344b58;--text:#edf3f4;--muted:#9eafb8;--cyan:#65cde5;--orange:#ed7a55;--gold:#e6b65d;--green:#79d39b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{background:radial-gradient(circle at 20% 0,#1c3746,transparent 44%),var(--bg)}main{min-height:720px;padding:20px}.head{display:flex;justify-content:space-between;gap:16px}.eyebrow{font-size:10px;color:var(--cyan);letter-spacing:.16em}h1{font:600 26px/1.3 "STKaiti","KaiTi",serif;margin:5px 0}.lead{max-width:780px;color:#b6c3c9;font-size:13px;line-height:1.65}.badge{border:1px solid var(--line);padding:7px 10px;font-size:11px;color:#b6c3c8;height:max-content}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;margin-top:16px}.scene,.controls,.bottom{background:rgba(18,32,42,.94);border:1px solid var(--line);box-shadow:0 14px 38px rgba(0,0,0,.24)}.scene{min-height:445px;padding:12px}.scene svg{width:100%;height:420px;display:block}.controls{padding:14px}.controls h2,.bottom h2{font-size:10px;letter-spacing:.14em;color:#91a6b1;margin:0 0 11px}.row{margin:10px 0}.row label{display:flex;justify-content:space-between;font-size:11px;color:#c3cfd4}.row output{color:var(--cyan)}.row input{width:100%;accent-color:var(--orange);margin-top:6px}select,button{width:100%;padding:8px;background:#1d3240;border:1px solid #455d69;color:#eaf1f2;font-size:12px}button{cursor:pointer;margin-top:7px}button.on{border-color:var(--orange);background:#4b2e2a}.readouts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.readout{background:#0e1b24;border:1px solid #2c414c;padding:7px}.readout span{display:block;font-size:9px;color:#8fa3ad}.readout b{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}.bottom{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 16px}.plain{font:16px/1.6 "STKaiti","KaiTi",serif}.term{font-size:12px;line-height:1.65;color:#b5c3c9;border-left:2px solid var(--cyan);padding-left:11px}.term b{color:var(--cyan)}.gridline{stroke:#2a3e49;stroke-width:1}.axis{stroke:#71838c;stroke-width:1}.bridge{stroke:#8fa2ac;stroke-width:9;fill:none}.curve{stroke:var(--cyan);stroke-width:3;fill:none}.curve2{stroke:var(--gold);stroke-width:2;fill:none}.load{stroke:var(--orange);stroke-width:2}.node{fill:#182a35;stroke:#718994;stroke-width:2}.bad{fill:#ef7c59}.good{fill:#76d5a0}.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{border:1px solid #3c515d;background:#10202a;padding:11px;min-height:128px}.card.selected{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(101,205,229,.1)}.card h3{font:600 16px/1.2 "STKaiti","KaiTi",serif;margin:0 0 7px}.card p{font-size:10px;line-height:1.5;color:#a5b5bd}.card b{color:var(--green)}.metric{font:700 22px/1.2 "Arial Narrow",sans-serif;color:var(--gold)}
@media(max-width:800px){main{padding:12px}.head{display:block}.badge{display:inline-block;margin-top:7px}.layout{grid-template-columns:1fr}.scene{min-height:330px}.scene svg{height:310px}.bottom{grid-template-columns:1fr}.cardgrid{grid-template-columns:1fr 1fr}h1{font-size:22px}}
</style></head><body><main><header class="head"><div><div class="eyebrow">WIND · MODEL · FEM</div><h1 id="title"></h1><div class="lead" id="lead"></div></div><div class="badge" id="badge"></div></header><div class="layout"><section class="scene"><svg viewBox="0 0 900 420"><g id="draw"></g></svg></section><aside class="controls"><h2>PARAMETERS / 参数台</h2><div id="host"></div><div class="readouts" id="readouts"></div></aside><section class="bottom"><div><h2>图现在告诉你什么</h2><div class="plain" id="plain"></div></div><div><h2>模型名字与使用边界</h2><div class="term" id="term"></div></div></section></div></main><script>
const mode=new URLSearchParams(location.search).get('mode')||'wind',$=id=>document.getElementById(id),host=$('host'),draw=$('draw'),ro=$('readouts'),S={};function header(t,l,b){$('title').textContent=t;$('lead').textContent=l;$('badge').textContent=b}function slider(k,l,min,max,step,v,u=''){S[k]=v;const d=document.createElement('div');d.className='row';d.innerHTML=`<label>${l}<output>${v}${u}</output></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}">`;host.appendChild(d);const i=d.querySelector('input');i.oninput=()=>{S[k]=+i.value;d.querySelector('output').textContent=i.value+u;render()}}function select(k,l,items,v){S[k]=v;const d=document.createElement('div');d.className='row';d.innerHTML=`<label>${l}</label><select>${items.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select>`;host.appendChild(d);d.querySelector('select').onchange=e=>{S[k]=e.target.value;render()}}function toggle(k,l,v=false){S[k]=v;const b=document.createElement('button');b.textContent=l;b.classList.toggle('on',v);b.onclick=()=>{S[k]=!S[k];b.classList.toggle('on',S[k]);render()};host.appendChild(b)}function read(l,v){return `<div class="readout"><span>${l}</span><b>${v}</b></div>`}
function windSetup(){header('风不是一个数，它会找桥的节奏','先把风速调大，再把频率比推到 1 附近。哪一次变化更突然？','第 16 章 · 风');slider('U','风速 U',5,70,1,25,' m/s');slider('zeta','阻尼比 ζ',.2,5,.1,1,'%');slider('r','激励频率 / 自振频率',.2,2,.02,.7,'');select('shape','主梁外形',[['box','流线箱梁'],['plate','钝体板梁']], 'box')}
function modelSetup(){header('先问问题，再决定模型里留下什么','换一个要回答的问题；同一座桥会需要不同的“删减版本”。','第 17 章 · 模型');select('question','这次要回答什么',[['reaction','支座反力怎样分'],['deflection','整体挠度多大'],['local','局部细节会不会先坏'],['wind','会不会遇到振动问题'],['stage','施工到这一阶段安全吗']], 'deflection')}
function femSetup(){header('有限元给出很多小数，先查三件朴素的事','改变网格，再故意漏掉自重或锁死转角；看结果怎样露出破绽。','第 18 章 · 有限元与 AI');slider('n','梁单元数量',2,24,1,6,'');slider('L','跨度 L',10,80,2,30,' m');slider('q','均布荷载 q',5,80,5,25,' kN/m');slider('E','弹性模量 E',20,220,10,35,' GPa');slider('I','截面惯性矩 I',.05,3,.05,.5,' m⁴');toggle('miss','故意漏掉 8 kN/m 自重',false);toggle('fixed','故意把两端转角也锁住',false)}
({wind:windSetup,models:modelSetup,fem:femSetup}[mode]||windSetup)();
function render(){if(mode==='wind')wind();if(mode==='models')models();if(mode==='fem')fem()}
function wind(){const rho=.613,q=rho*S.U*S.U,shape=S.shape==='box'?.72:1.18,staticF=q*shape,D=1/Math.sqrt((1-S.r*S.r)**2+(2*S.zeta/100*S.r)**2),amp=Math.min(135,12*Math.log1p(D)),pts=[];for(let i=0;i<=100;i++){const x=120+660*i/100,y=230+amp*Math.sin(i/100*Math.PI*4);pts.push((i?'L':'M')+x+' '+y)}draw.innerHTML=`<path d="M100 230H800" class="bridge"/><path d="${pts.join(' ')}" class="curve"/>${Array.from({length:8},(_,i)=>`<path d="M${40+i*95} ${95+i%2*10}h55" class="load"/><path d="M${85+i*95} ${88+i%2*10}l10 7-10 7" fill="#ed7a55"/>`).join('')}<text x="450" y="365" text-anchor="middle" fill="#9fb0b8">蓝线为振型方向上的响应放大示意，不是气动外形预测</text>`;ro.innerHTML=read('速度压力量级',q.toFixed(0)+' Pa')+read('静风力代理',staticF.toFixed(0))+read('动力放大系数',D.toFixed(2))+read('频率比',S.r.toFixed(2));$('plain').innerHTML=Math.abs(S.r-1)<.08?`频率比靠近 1，响应突然亮起来。<span class="metric">阻尼很小的时候，“踩中节奏”比单纯加一点风速更敏感。</span>`:`风速提高，静力效应按平方增长；当前还没有踩中最敏感的频率邻域。`;$('term').innerHTML='<b>静风与受迫振动：</b>速度压力 q≈0.613U²；单自由度放大系数 D=1/√[(1−r²)²+(2ζr)²]。这不是颤振、驰振或涡振的气动弹性求解，不能给出临界风速。'}
function models(){const all=[{k:'beam',n:'一维梁单元',keep:'整体弯曲、支反力',omit:'横向分布与局部细节',for:['reaction','deflection','stage']},{k:'grillage',n:'梁格/空间杆系',keep:'纵横向分配、扭转',omit:'板壳局部应力',for:['reaction','deflection','wind']},{k:'shell',n:'板壳模型',keep:'箱梁板件与局部应力',omit:'实体厚度方向细节',for:['local','wind','stage']},{k:'solid',n:'实体模型',keep:'局部三维应力',omit:'大范围建模效率',for:['local']},{k:'cable',n:'索—梁几何非线性',keep:'初始索力与大位移',omit:'混凝土局部裂缝',for:['wind','stage']},{k:'stage',n:'施工阶段模型',keep:'单元激活、龄期和体系转换',omit:'未录入的现场偏差',for:['stage']}];draw.innerHTML='<foreignObject x="20" y="10" width="860" height="400"><div xmlns="http://www.w3.org/1999/xhtml" class="cardgrid">'+all.map(x=>`<article class="card ${x.for.includes(S.question)?'selected':''}"><h3>${x.n}</h3><p><b>保留：</b>${x.keep}</p><p>省略：${x.omit}</p></article>`).join('')+'</div></foreignObject>';const picks=all.filter(x=>x.for.includes(S.question));ro.innerHTML=read('当前候选',picks.length+' 个')+read('第一选择',picks[0].n);$('plain').innerHTML=`问题一换，模型也换。当前问题更需要“<span class="metric">${picks[0].n}</span>”；不是因为它最高级，而是它保留了眼下要看的机制。`;$('term').innerHTML='<b>模型许可：</b>每个模型都应写清问题、保留机制、省略机制、参数来源和适用边界。模型越复杂不等于答案越可靠；缺失的输入会被更精细地计算。'}
function solve(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(Math.abs(M[i][k])>Math.abs(M[p][k]))p=i;[M[k],M[p]]=[M[p],M[k]];const d=M[k][k];if(Math.abs(d)<1e-14)throw Error('singular');for(let j=k;j<=n;j++)M[k][j]/=d;for(let i=0;i<n;i++)if(i!==k){const f=M[i][k];for(let j=k;j<=n;j++)M[i][j]-=f*M[k][j]}}return M.map(r=>r[n])}
function beamFE(n,L,q,EI,fixed){const nd=2*(n+1),K=Array.from({length:nd},()=>Array(nd).fill(0)),F=Array(nd).fill(0),le=L/n,k0=EI/le**3,ke=[[12,6*le,-12,6*le],[6*le,4*le*le,-6*le,2*le*le],[-12,-6*le,12,-6*le],[6*le,2*le*le,-6*le,4*le*le]],fe=[q*le/2,q*le*le/12,q*le/2,-q*le*le/12];for(let e=0;e<n;e++){const map=[2*e,2*e+1,2*e+2,2*e+3];for(let i=0;i<4;i++){F[map[i]]+=fe[i];for(let j=0;j<4;j++)K[map[i]][map[j]]+=k0*ke[i][j]}}const fixedD=fixed?[0,1,nd-2,nd-1]:[0,nd-2],free=[...Array(nd).keys()].filter(i=>!fixedD.includes(i)),Kr=free.map(i=>free.map(j=>K[i][j])),Fr=free.map(i=>F[i]),ur=solve(Kr,Fr),u=Array(nd).fill(0);free.forEach((d,i)=>u[d]=ur[i]);const R=K.map((row,i)=>row.reduce((s,x,j)=>s+x*u[j],0)-F[i]);return{u,R,F,le}}
function fem(){const self=S.miss?0:8,q=(S.q+self)*1000,L=S.L,E=S.E*1e9,I=S.I,EI=E*I,res=beamFE(S.n,L,q,EI,S.fixed),ys=[];for(let i=0;i<=S.n;i++)ys.push(res.u[2*i]);const max=Math.max(...ys.map(Math.abs),1e-12),pts=ys.map((v,i)=>(i?'L':'M')+(100+700*i/S.n)+' '+(205+120*v/max));const reaction=-(res.R[0]+res.R[2*S.n]),balance=reaction-q*L,closed=S.fixed?q*L**4/(384*EI):5*q*L**4/(384*EI),err=(max/closed-1)*100;draw.innerHTML=`<path d="M100 205H800" class="bridge"/><path d="${pts.join(' ')}" class="curve"/>${ys.map((v,i)=>`<circle cx="${100+700*i/S.n}" cy="${205+120*v/max}" r="4" class="node"/>`).join('')}${Array.from({length:9},(_,i)=>`<line x1="${135+i*80}" y1="70" x2="${135+i*80}" y2="150" class="load"/>`).join('')}<text x="450" y="370" text-anchor="middle" fill="#9fb0b8">变形放大后显示；节点数随网格变化</text>`;ro.innerHTML=read('最大挠度', (max*1000).toFixed(2)+' mm')+read('闭式解', (closed*1000).toFixed(2)+' mm')+read('相对差',err.toFixed(2)+'%')+read('平衡残差',(balance/1000).toExponential(1)+' kN');$('plain').innerHTML=`平衡残差为 <span class="metric">${(balance/1000).toExponential(1)} kN</span>，网格解与同边界闭式解相差 ${err.toFixed(2)}%。${S.miss?'但你故意漏掉了自重：方程可以平衡，模型仍然不完整。':''}${S.fixed?' 两端转角被锁死后，桥已经不是简支梁。':''}`;$('term').innerHTML=`<b>Euler–Bernoulli 梁单元：</b>每节点竖向位移与转角两个自由度，线弹性、小变形、均布荷载。单位统一为 N、m、Pa；${S.fixed?'当前为两端固结。':'当前为两端简支。'} 校核依次看平衡、闭式解、网格趋势，再讨论更复杂模型。`}
render();
</script><script src="./learning-cycle.js"></script></body></html>
